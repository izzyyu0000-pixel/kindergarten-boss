:root {
  color-scheme: dark;
  --k: #3b2f2a;   /* 墨棕 */
  --w: #f7f0e4;   /* 奶白 */
  --r: #c47a62;   /* 陶土紅 */
  --y: #d9b45f;   /* 芥黃 */
  --g: #8fa88a;   /* 鼠尾草綠 */
  --b: #8fadbd;   /* 灰藍 */
  --s: #d6c1a0;   /* 牆深(次要文字) */
  --d: #5a463b;   /* 深棕(選取底色) */
  --px: "KBoss Pixel", monospace;
  /* ▶ 游標：一格一格的像素三角形 */
  --tri-r: polygon(5px 2px,7px 2px,7px 4px,9px 4px,9px 6px,11px 6px,11px 8px,13px 8px,13px 10px,15px 10px,15px 12px,13px 12px,13px 14px,11px 14px,11px 16px,9px 16px,9px 18px,7px 18px,7px 20px,5px 20px);
  --tri-l: polygon(17px 2px,15px 2px,15px 4px,13px 4px,13px 6px,11px 6px,11px 8px,9px 8px,9px 10px,7px 10px,7px 12px,9px 12px,9px 14px,11px 14px,11px 16px,13px 16px,13px 18px,15px 18px,15px 20px,17px 20px);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }

html, body {
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;       /* 防止下拉重新整理、橡皮筋捲動 */
  background: var(--k);
  color: var(--w);
  font-family: var(--px);
  font-size: 22px;
  line-height: 33px;
  -webkit-font-smoothing: none;
  font-smooth: never;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}

/* 整個 App 固定填滿畫面，上下左右避開瀏海與 Home 條 */
#app {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  padding-top: calc(env(safe-area-inset-top) + 11px);
  padding-bottom: calc(env(safe-area-inset-bottom) + 11px);
  padding-left: calc(env(safe-area-inset-left) + 11px);
  padding-right: calc(env(safe-area-inset-right) + 11px);
  max-width: 520px;
  margin: 0 auto;
  background: var(--k);
}
/* CRT 掃描線(透明度 5%，不擋點擊) */
.crt { position: fixed; inset: 0; pointer-events: none; z-index: 200;
  background: none; display: none; }

.screen { display: none; flex: 1; flex-direction: column; min-height: 0; gap: 11px; }
.screen.active { display: flex; }

/* 字級(只用 11 的倍數) */
.t11 { font-size: 11px; line-height: 16px; }
.t22 { font-size: 22px; line-height: 33px; }
.t33 { font-size: 33px; line-height: 44px; }
.t44 { font-size: 44px; line-height: 55px; }

button, a.opt { font-family: var(--px); font-size: inherit; line-height: inherit; color: inherit; background: none; border: none;
  cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none; text-align: left; text-decoration: none; }

/* 螢幕閱讀器用(畫面上不顯示) */
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* emoji 畫到 16×16 canvas 再放大 → 像素圖 */
canvas.pix { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }

/* 雙線白框對話框 */
.box { border: 4px solid var(--w); box-shadow: inset 0 0 0 3px var(--k), inset 0 0 0 5px var(--w);
  background: var(--k); padding: 16px 14px; position: relative; }
.box.res { border-color: var(--y); box-shadow: inset 0 0 0 3px var(--k), inset 0 0 0 5px var(--y); }

/* 閃爍 */
@keyframes bl { 50% { opacity: 0; } }
.blink { animation: bl 1s steps(1) infinite; }

/* 選單：▶ 游標 */
.menu { display: grid; gap: 4px; flex: none; }
.opt { display: flex; align-items: center; gap: 8px; padding: 4px 6px; width: 100%; color: var(--w); min-width: 0; overflow-wrap: anywhere; }
.opt::before { content: ""; flex: none; width: 22px; height: 22px; }
.opt.sel { background: var(--d); }
.opt.sel::before { background: var(--y); clip-path: var(--tri-r); animation: bl 1s steps(1) infinite; }

/* ========== 開局畫面(PRESS START) ========== */
.title { text-align: center; color: var(--y); text-shadow: 4px 4px 0 var(--r); margin-top: 33px; overflow-wrap: anywhere; }
.start-top { flex: none; max-height: 100%; overflow-y: auto; }
.slot { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: start; }
.slot .k { color: var(--s); }
.slot .v { color: var(--g); min-width: 0; overflow-wrap: anywhere; }
.trait-item + .trait-item::before { content: "・"; }
.start-notes { color: var(--s); margin-top: 11px; overflow-wrap: anywhere; }
.start-notes > div + div { margin-top: 4px; }
/* 抽身份與特質：格子閃爍(≤1 秒) */
.rolling { position: relative; color: transparent !important; }
.rolling::after { content: ""; position: absolute; left: 0; top: 6px; bottom: 6px; width: min(100%, 154px);
  background: repeating-linear-gradient(90deg, var(--g) 0 18px, transparent 18px 22px); animation: roll .12s steps(1) infinite; }
@keyframes roll { 50% { background-position: 11px 0; opacity: .4; } }
.spacer { flex: 1; min-height: 0; }
.press { display: flex; justify-content: center; align-items: center; gap: 8px; width: 100%; color: var(--w);
  text-align: center; flex: none; animation: bl 1.2s steps(1) infinite; }
.press::before { content: ""; width: 22px; height: 22px; background: var(--w); clip-path: var(--tri-r); }
.sub { text-align: center; color: var(--s); flex: none; width: 100%; padding: 4px 0; text-align: center; }

/* ========== 遊戲畫面 ========== */
/* 上方狀態列：像素圖示 + 名稱 + 10 格數值條 */
.stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; flex: none; }
.stat { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 0; position: relative; min-width: 0; }
.stat-label { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; max-width: 100%; }
.stat-icon { width: 32px; height: 32px; }
.stat-name { font-size: 11px; line-height: 11px; color: var(--s); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.stat-bar { display: grid; grid-template-columns: repeat(10, 6px); gap: 2px; }
.stat-bar i { height: 9px; background: var(--d); }
.stat-bar i.on { background: var(--g); }
.stat-bar.low i.on { background: var(--r); }
.stat-bar.high i.on { background: var(--y); }
/* (VS v1：拖曳時的圓點預覽已移除，選擇前看不到哪些數值會動) */
/* 危險區(≤15 或 ≥85)：數值條持續閃紅 */
.stat.danger .stat-bar i.on { background: var(--r); }
.stat.danger .stat-bar { animation: danger .6s steps(1) infinite; }
@keyframes danger { 50% { opacity: .25; } }
/* 單一數值一次掉 ≥ 13：整個畫面震動 0.3 秒 */
@keyframes shake { 0% { transform: translate(0, 0); } 20% { transform: translate(-6px, 2px); } 40% { transform: translate(6px, -2px); }
  60% { transform: translate(-4px, -2px); } 80% { transform: translate(4px, 2px); } 100% { transform: translate(0, 0); } }
#app.shake { animation: shake .3s steps(5); }
/* 選擇後：有變動的數值框起來、閃爍 2 次、顯示 ↑／↓ */
.stat.changed { outline: 2px solid var(--y); outline-offset: 1px; }
.stat.changed .stat-bar { animation: flash .3s steps(1) 2; }
@keyframes flash { 50% { opacity: 0; } }
.stat-mark { position: absolute; right: 2px; top: 2px; }
.stat-arrow { font-size: 22px; line-height: 22px; color: var(--y); }

.week { display: flex; justify-content: space-between; gap: 11px; color: var(--s); flex: none; }
.week > span:last-child { text-align: right; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.week-left { color: var(--w); }
/* 第三階段：評鑑倒數警示條(紅底黑字、外框閃爍) */
.eval-bar { flex: none; background: var(--r); color: var(--k); text-align: center; padding: 2px 6px;
  outline: 3px solid var(--y); animation: evalbar 1s steps(1) infinite; }
@keyframes evalbar { 50% { outline-color: var(--k); } }
/* 任務進度(常駐) */
.mission-bar { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--y);
  border: 2px solid var(--y); padding: 1px 6px; }
.mission-bar.done { color: var(--g); border-color: var(--g); }
.mission-text { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.mbar { flex: none; width: 60px; height: 8px; background: var(--d); position: relative; }
.mbar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--y); }
.mission-bar.done .mbar i { background: var(--g); }
/* 事件佇列 */
.queue { flex: none; display: flex; flex-direction: column; gap: 4px; }
.q-head { display: flex; justify-content: space-between; gap: 8px; color: var(--s); }
.q-title { color: var(--w); white-space: nowrap; }
.q-cost { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; text-align: right; }
.q-cost.up { color: var(--r); }
.q-list { display: flex; flex-direction: column; gap: 4px; }
.q-item { display: flex; align-items: center; gap: 6px; width: 100%; text-align: left; padding: 1px 6px; min-height: 34px;
  border: 3px solid var(--s); background: #14172a; color: var(--w); position: relative; }
.q-item.phone { border-color: var(--r); }
.q-item.mail { border-color: var(--y); }
.q-item.group { border-color: var(--b); }
.q-item.sel { outline: 3px solid var(--w); outline-offset: 0; background: #1b2040; }
.q-item.dim { opacity: .5; }
.q-ic { flex: none; }
.q-main { flex: 1; min-width: 0; display: flex; flex-direction: row; gap: 6px; align-items: baseline; overflow: hidden; }
.q-who { flex: none; max-width: 38%; color: var(--s); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.q-pips { color: var(--y); letter-spacing: 1px; }
.q-tx { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.q-st { flex: none; text-align: right; max-width: 34%; display: flex; flex-direction: column; }
.q-st .tag { padding: 0 4px; color: var(--k); background: var(--y); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.q-item.phone .q-st .tag { background: var(--r); color: var(--w); }
.q-item.group .q-st .tag { background: var(--b); color: var(--w); }
.q-st .esc { color: var(--r); white-space: nowrap; }
.q-note { color: var(--s); }
.q-note.full { color: var(--r); }
.chan-tag { position: absolute; right: 14px; top: -14px; background: var(--k); border: 4px solid var(--w); padding: 2px 10px; color: var(--w); white-space: nowrap; max-width: 55%; overflow: hidden; text-overflow: ellipsis; }
.chan-tag.phone { border-color: var(--r); color: var(--r); }
.chan-tag.mail { border-color: var(--y); color: var(--y); }
.chan-tag.group { border-color: var(--b); color: var(--b); }
#tutorial-body { text-align: left; }
.notice-head { color: var(--y); }
.notice-lines { text-align: left; display: grid; gap: 11px; }
.notice-lines .nl-line { color: var(--w); }
.notice-lines .nl-res { color: var(--y); }
/* 矮螢幕(≤700px)：待辦區縮小，確保對話框和選項不被擠掉 */
@media (max-height: 700px) {
  .q-note:not(.full) { display: none; }
  .t22 { font-size: 20px; line-height: 29px; }
  .stat-icon { width: 26px !important; height: 26px !important; }
  .avatar { width: 52px; height: 52px; }
  .avatar canvas { width: 52px !important; height: 52px !important; }
}
/* 機率選項：選項後面的小骰子 */
.opt .dice { flex: none; margin-left: auto; opacity: .9; }
.res-tag { color: var(--s); display: block; }
/* 過場標題、評鑑結果(全螢幕，點一下繼續) */
.stat-dot-slot { position: absolute; left: 2px; top: 2px; width: 14px; height: 14px; display: flex; align-items: center; justify-content: center; }
.dot { background: var(--w); }
.dot.s { width: 6px; height: 6px; }
.dot.m { width: 10px; height: 10px; }
.dot.l { width: 14px; height: 14px; }
.overlay { position: absolute; inset: -11px; z-index: 20; background: var(--k); display: none; flex-direction: column;
  align-items: stretch; justify-content: center; gap: 22px; padding: 11px; text-align: center; }
.overlay.active { display: flex; }
.overlay-title { color: var(--y); text-shadow: 3px 3px 0 var(--r); overflow-wrap: anywhere; }
.overlay-sub { color: var(--w); overflow-wrap: anywhere; }
.overlay-next { color: var(--s); }
.eval-lines { text-align: left; display: grid; gap: 4px; }
.eval-line { display: flex; justify-content: space-between; gap: 11px; }
.eval-line .n { color: var(--y); white-space: nowrap; }
.eval-line.neg .n { color: var(--r); }
.eval-total { border-top: 2px dashed var(--s); padding-top: 6px; }
.eval-grade { color: var(--y); }
.eval-grade.bad { color: var(--r); }
#screen-game { position: relative; }

/* 中間區域(#card)：數值列和選單之間整塊都可以開始拖曳，拖曳時對話框跟著移動 */
.card-area { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 11px; }
.card { touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; will-change: transform; }
.card:active { cursor: grabbing; }
.dialog { flex: none; margin-top: 14px; }
.nameplate { position: absolute; left: 14px; top: -14px; background: var(--k); border: 4px solid var(--w); padding: 2px 10px;
  color: var(--y); max-width: calc(100% - 28px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dlg { display: flex; gap: 12px; align-items: flex-start; padding-top: 8px; }
.avatar { flex: none; width: 64px; height: 64px; overflow: hidden; }
.dlg p { min-width: 0; overflow-wrap: anywhere; }
.untyped { visibility: hidden; }
.type-cursor { color: var(--y); animation: bl 1s steps(1) infinite; }
.typing .type-cursor { visibility: hidden; }
.showing-result .type-cursor { visibility: hidden; }
.res-text { color: var(--y); overflow-wrap: anywhere; }

/* 下方：選項選單；左右滑動提示 */
.typing #reply .opt.sel::before { visibility: hidden; }
.tap-row { flex: none; min-height: 16px; display: flex; justify-content: center; }
.tap-hint, #btn-next { color: var(--s); text-align: center; }
#btn-next { width: 100%; }
.tap-hint { display: flex; align-items: center; gap: 4px; }
.tap-hint::before, .tap-hint::after { content: ""; width: 22px; height: 22px; transform: scale(.5); background: var(--s); }
.tap-hint::before { clip-path: var(--tri-l); }
.tap-hint::after { clip-path: var(--tri-r); }


/* ========== 教室場景版(v2.1) ========== */
#screen-game { gap: 6px; }
.hud { display: flex; align-items: center; gap: 8px; color: var(--s); flex: none; }
.week-label { color: var(--w); white-space: nowrap; }
.yearbar { flex: 1; height: 6px; background: var(--d); position: relative; min-width: 40px; }
.yearbar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--y); }
#week-identity { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40%; }
.stats-row { gap: 4px; }
.stats-row .stat { flex-direction: row; gap: 4px; padding: 2px 0; align-items: center; justify-content: center; }
.stats-row .stat-label { flex: none; }
.stats-row .stat-name { display: none; }
.stat-sprite { width: 24px; height: 15px; image-rendering: pixelated; display: block; }
.stats-row .stat-bar { grid-template-columns: repeat(10, 1fr); gap: 1px; flex: 1; min-width: 0; }
.stats-row .stat-bar i { height: 8px; }
.stats-row .stat-mark { right: -2px; top: -10px; }
.stat-arrow { font-size: 22px; }
.stats-row.tut-focus { outline: 3px solid var(--y); outline-offset: 2px; animation: bl 1s steps(1) infinite; }
.eval-bar { padding: 0 6px; outline-width: 2px; }
#scene-wrap { position: relative; flex: none; margin: 0 auto; background: var(--k); }
#scene { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
#hot { position: absolute; inset: 0; }
.hotbtn { position: absolute; transform: translate(-50%, -50%); width: 48px; height: 48px; background: transparent; border: 0; border-radius: 0; }
.hotbtn:focus-visible { outline: 3px solid var(--y); }
.dock { flex: 1; min-height: 0; display: flex; flex-direction: column; margin-top: 14px; padding: 12px 12px 8px; }
.dock.res { border-color: var(--y); box-shadow: inset 0 0 0 3px var(--k), inset 0 0 0 5px var(--y); }
#dock-idle, #dock-card, #card-result { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
.dock-text, .idle-text { overflow-wrap: anywhere; }
.idle-text { color: var(--w); }
.idle-cost { color: var(--s); }
.idle-cost.up, .idle-note.full { color: var(--r); }
.idle-note { color: var(--s); }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: auto; }
.opts .opt { min-height: 44px; justify-content: center; text-align: center; padding: 6px 4px; border: 2px solid var(--d); background: transparent; position: relative; }
.opts .opt::before { display: none; }
.opts .opt.sel { background: var(--d); border-color: var(--y); }
.opts .opt .dice { margin-left: 6px; }
.mission-bar { flex: none; }
.start-scene { flex: none; display: flex; justify-content: center; }
#start-canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; border: 4px solid var(--w); }
.nameplate[hidden], .chan-tag[hidden] { display: none; }
.chan-tag { top: -14px; }

/* ========== GAME OVER ========== */
.end-top { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 11px; }
.end-top > * { flex: none; }
.go { text-align: center; color: var(--r); letter-spacing: 4px; }
.etitle { text-align: center; color: var(--y); overflow-wrap: anywhere; }
.ecause { text-align: center; color: var(--s); margin-top: -8px; }
.end-text { overflow-wrap: anywhere; }
.last { border: 2px dashed var(--s); padding: 8px 10px; color: var(--s); overflow-wrap: anywhere; }
.last-card-label { color: var(--w); display: block; }
.last-card-speaker::after { content: "："; }
.last-card-result { color: var(--y); }
.cont { display: flex; justify-content: space-between; gap: 11px; color: var(--s); }
.go.clear { color: var(--g); }
/* 年度成績單 */
.report { display: grid; gap: 2px; }
.report-head { color: var(--y); }
.report-row { display: flex; justify-content: space-between; gap: 11px; }
.report-row .k { color: var(--s); white-space: nowrap; }
.report-row .v { text-align: right; overflow-wrap: anywhere; min-width: 0; }
.report-comment { color: var(--y); margin-top: 6px; overflow-wrap: anywhere; }
.end-buttons { padding: 11px 10px; }
.cont-n { color: var(--r); margin-left: 8px; }
.btn-row { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; }
.btn-row .opt { justify-content: center; padding: 4px 2px; white-space: nowrap; }
.btn-row .opt::before { display: none; }
.btn-row .opt:hover, .btn-row .opt:focus-visible { background: var(--d); }

/* ========== 結局圖鑑 ========== */
.gallery-head { display: flex; justify-content: space-between; align-items: baseline; gap: 11px; flex: none; }
.gallery-title { color: var(--y); text-shadow: 3px 3px 0 var(--r); }
.gallery-count { color: var(--s); white-space: nowrap; }
.gallery-list { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  display: flex; flex-direction: column; gap: 6px; }
.gallery-item { display: flex; justify-content: space-between; align-items: center; gap: 11px; padding: 2px 6px; flex: none; }
.gallery-item-title { color: var(--y); overflow-wrap: anywhere; min-width: 0; }
.gallery-item.locked .gallery-item-title { color: var(--s); letter-spacing: 4px; }
.gallery-item-hint { color: var(--s); white-space: nowrap; font-size: 11px; line-height: 16px; }

/* ========== 分享圖遮罩(無法用系統分享時) ========== */
.share-overlay { position: fixed; inset: 0; z-index: 100; background: var(--k); color: var(--w);
  display: none; flex-direction: column; align-items: center; justify-content: center; gap: 11px;
  padding: calc(env(safe-area-inset-top) + 11px) calc(env(safe-area-inset-right) + 11px)
           calc(env(safe-area-inset-bottom) + 11px) calc(env(safe-area-inset-left) + 11px); }
.share-overlay.active { display: flex; }
.share-tip { color: var(--y); text-align: center; }
.share-img-wrap { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
.share-img { max-width: 100%; max-height: 100%; object-fit: contain; border: 4px solid var(--w);
  -webkit-touch-callout: default; user-select: auto; -webkit-user-select: auto; }
.share-sub { color: var(--s); text-align: center; }
#btn-share-close { width: auto; }

/* 錯誤訊息(資料讀不到時) */
.fatal { margin: auto; padding: 20px; text-align: center; }

/* 動態減少：關掉閃爍與動畫 */
@media (prefers-reduced-motion: reduce) {
  .blink, .press, .opt.sel::before, .type-cursor, .stat.changed .stat-bar, .rolling::after,
  .stat.danger .stat-bar, #app.shake, .eval-bar { animation: none !important; }
  .stat.danger { outline: 2px solid var(--r); }
}

/* ========== 除錯模式(只有 ?debug=1 才會由程式建立) ========== */
.dbg-panel {
  position: fixed;
  left: calc(env(safe-area-inset-left) + 6px);
  top: calc(env(safe-area-inset-top) + 92px);
  z-index: 150;
  max-width: 62vw;
  max-height: 60vh;
  overflow-y: auto;
  background: rgba(20, 20, 20, 0.82);
  color: #e8ffe8;
  font: 11px/1.45 ui-monospace, Menlo, Consolas, monospace;
  border-radius: 8px;
  padding: 6px 8px;
}
.dbg-panel.collapsed .dbg-body { display: none; }
.dbg-panel button { font: 11px ui-monospace, monospace; padding: 2px 6px; border-radius: 4px; background: #555; color: #fff; }
.dbg-panel input { width: 52px; font-size: 12px; }
.dbg-row { display: flex; gap: 6px; align-items: center; margin-top: 4px; }
.dbg-start { background: #222; color: #e8ffe8; border-radius: 10px; padding: 8px 10px; font: 12px/1.5 ui-monospace, monospace; margin-top: 11px; }
.dbg-start select { font-size: 13px; max-width: 100%; }
.dbg-start label { display: inline-flex; align-items: center; gap: 3px; margin: 2px 8px 2px 0; }
</style>

<body>
<div id="app">

  <!-- 開局畫面(PRESS START) -->
  <section id="screen-start" class="screen">
    <h1 class="title t44" id="start-title"></h1>
    <div class="start-scene"><canvas id="start-canvas"></canvas></div>
    <div class="box start-top">
      <div class="slot t22">
        <span class="k">身份</span><span class="v" id="start-identity-name"></span>
        <span class="k">特質</span><span class="v" id="start-traits"></span>
        <span class="k">任務</span><span class="v start-mission" id="start-mission"></span>
      </div>
      <div class="start-notes t11">
        <div id="start-identity-desc"></div>
        <div id="start-trait-descs"></div>
      </div>
      <!-- 除錯模式的開局選單會插在這裡 -->
      <div id="start-debug-slot"></div>
    </div>
    <div class="spacer"></div>
    <button class="press t22" id="btn-start" type="button">PRESS START</button>
    <button class="sub t11" id="btn-gallery-start" type="button"></button>
    <div class="sub t11" id="start-version"></div>
  </section>

  <!-- 遊戲畫面：上方列、教室場景、下方對話框 -->
  <section id="screen-game" class="screen">
    <div class="hud t11" id="hud"><span class="week-label" id="week-label"></span><span class="yearbar"><i id="year-fill"></i></span><span id="week-identity"></span></div>
    <div class="stats-row" id="stats-row"></div>
    <!-- 第三階段：評鑑倒數警示條 -->
    <div class="eval-bar t11" id="eval-bar" hidden></div>
    <div id="scene-wrap"><canvas id="scene"></canvas><div id="hot"></div></div>
    <div class="box dock" id="dock">
      <span class="nameplate t11" id="card-speaker" hidden></span>
      <span class="chan-tag t11" id="card-chan" hidden></span>
      <div id="dock-idle">
        <div class="mission-bar t11" id="mission-bar"><span class="mission-text" id="mission-text"></span><span class="mbar"><i id="mission-fill"></i></span></div>
        <p class="t22 idle-text" id="idle-text"></p>
        <div class="t11 idle-cost" id="idle-cost"></div>
        <div class="t11 idle-note" id="idle-note"></div>
      </div>
      <div id="dock-card" hidden>
        <p class="t22 dock-text"><span id="card-text"></span><span class="type-cursor" id="type-cursor">▼</span></p>
        <div class="opts" id="reply">
          <button type="button" class="opt" id="btn-left"></button>
          <button type="button" class="opt" id="btn-right"></button>
        </div>
      </div>
      <div id="card-result" hidden>
        <p class="t22 res-text" id="result-text"></p>
        <span class="sr-only" id="result-choice"></span>
      </div>

      use(ctx); ctx.clearRect(0, 0, W, H);

    // 下排學童偶爾轉頭或站起來揮手

      if (still) return;
      Object.keys(anim.bot).forEach(function (i) { var a = anim.bot[i]; if (a.mode && t > a.until) a.mode = null; });
      if (t > anim.nextEvt) {

    function loop() {
      var t = performance.now();
      idle(t); render(t);
    }
    function start() { if (timer || still) { render(performance.now()); return; } timer = setInterval(loop, 90); }
    function stop() { clearInterval(timer); timer = null; }

    setScale(opts.scale || 4);
    return {
      W: W, H: H, setScale: setScale, setView: function (v) { for (var kk in v) view[kk] = v[kk]; },
      getView: function () { return view; }, render: render, start: start, stop: stop,
      bubblePos: function (b, i) { return bubbleAt(b, i); }, spots: SPOTS,

    };
  }
  return { create: create, statIcons: STAT_ICONS, palette: P };

<script>
/* =====================================================================
 * 第一部分：遊戲引擎(不碰畫面)
 * 規則來源：stage0-spec.md 第 3–5 節
 * 對外介面：window.GameEngine
 * ===================================================================== */
(function () {
  'use strict';

  // ---------- 讀取內嵌資料 ----------
  var DATA = null;
  try {
    DATA = JSON.parse(document.getElementById('game-data').textContent);
  } catch (e) {
    DATA = null;
  }
  if (!DATA || !DATA.stats || !DATA.cards || !DATA.endings) {
    window.GameEngine = null;
    return;
  }

  var RULES = DATA.rules || {};

  // ---------- 小工具 ----------

  // 可指定種子的亂數產生器(mulberry32)，回傳 0 ≤ x < 1
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // 四捨五入一律遠離零：2.5→3、-2.5→-3(不可直接用 Math.round)
  function roundAway(x) {
    return Math.sign(x) * Math.round(Math.abs(x));
  }

  function clamp(v, lo, hi) {
    return Math.max(lo, Math.min(hi, v));
  }

  function copy(obj) {
    return obj == null ? obj : JSON.parse(JSON.stringify(obj));
  }

  // 依 id 建立查詢表
  function indexById(list) {
    var map = {};
    (list || []).forEach(function (item) { map[item.id] = item; });
    return map;
  }

  var STAT_BY_ID = indexById(DATA.stats);
  var TAG_BY_ID = indexById(DATA.tags);
  var IDENTITY_BY_ID = indexById(DATA.identities);
  var TRAIT_BY_ID = indexById(DATA.traits);
  var CARD_BY_ID = indexById(DATA.cards);
  var ENDING_BY_ID = indexById(DATA.endings);

  // ---------- 比較運算子 ----------
  var OPS = {
    '>=': function (a, b) { return a >= b; },
    '<=': function (a, b) { return a <= b; },
    '>':  function (a, b) { return a > b; },
    '<':  function (a, b) { return a < b; },
    '==': function (a, b) { return a === b; }
  };

  // ---------- 條件判斷對照表(規格書 3.1) ----------
  // 新增條件類型：在這裡加一個函式即可(build.py 的 KNOWN_CONDITIONS 也要加)
  // ctx = { identity, traits, stats, tags, turn, cause }
  var CONDITIONS = {
    identity: function (c, ctx) {
      return (c.any || []).indexOf(ctx.identity) >= 0;
    },
    trait: function (c, ctx) {
      if (c.any && !c.any.some(function (t) { return ctx.traits.indexOf(t) >= 0; })) return false;
      if (c.none && c.none.some(function (t) { return ctx.traits.indexOf(t) >= 0; })) return false;
      return true;
    },
    tag: function (c, ctx) {
      var op = OPS[c.op];
      return !!op && op(ctx.tags[c.tag], c.value);
    },
    stat: function (c, ctx) {
      var op = OPS[c.op];
      return !!op && op(ctx.stats[c.stat], c.value);
    },
    minTurn: function (c, ctx) {
      return ctx.turn >= c.value;
    },
    // 僅結局使用；卡片判斷時 ctx.cause 為 null，一律不成立。bound=yearEnd 代表撐完學年
    cause: function (c, ctx) {
      if (!ctx.cause) return false;
      if (c.bound === 'yearEnd') return ctx.cause.bound === 'yearEnd';
      return ctx.cause.stat === c.stat && ctx.cause.bound === c.bound;
    },
    // 學年階段(1–4)
    phase: function (c, ctx) {
      return (c.any || []).indexOf(ctx.phase) >= 0;
    },
    // 評鑑等第(還沒評鑑時為 null)
    evalGrade: function (c, ctx) {
      return (c.any || []).indexOf(ctx.evalGrade) >= 0;
    },
    // 任一子條件成立
    or: function (c, ctx) {
      return (c.conditions || []).some(function (x) {
        var fn = CONDITIONS[x.type];
        return !!fn && fn(x, ctx);
      });
    },
    // 延遲回收：標籤「第一次往 dir 方向變動」後已過 minWeeks 週(只記卡片選擇造成的變動)
    tagSince: function (c, ctx) {
      var f = ctx.tagFirst[c.tag] && ctx.tagFirst[c.tag][c.dir];
      return f != null && (ctx.turn - f) >= c.minWeeks;
    }
  };

  function checkAll(conditions, ctx) {
    var list = conditions || [];
    for (var i = 0; i < list.length; i++) {
      var fn = CONDITIONS[list[i].type];
      if (!fn) return false;            // 未知類型視為不成立(build 時就會擋下)
      if (!fn(list[i], ctx)) return false;
    }
    return true;
  }

  // ---------- 遊戲狀態 ----------
  var S = null;      // 目前這一局
  var rng = Math.random;

  function makeCtx(cause) {
    return {
      identity: S.identity,
      traits: S.traits,
      stats: S.stats,
      tags: S.tags,
      turn: S.turn,
      phase: currentPhase(),
      evalGrade: S.evalGrade,
      tagFirst: S.tagFirst,
      cause: cause || null
    };
  }

  // 學年設定(rules.year)；沒有設定時 phase = 0、不會有學年結束與評鑑
  var YEAR = RULES.year || null;
  function phaseOf(turn) {
    if (!YEAR) return 0;
    var p = 0;
    (YEAR.phaseStarts || []).forEach(function (w) { if (turn >= w) p++; });
    return p;
  }
  function currentPhase() { return phaseOf(S.turn); }

  // 依權重抽一個(weights 與 items 一一對應)
  function weightedPick(items, weights) {
    var total = 0;
    for (var i = 0; i < weights.length; i++) total += weights[i];
    var r = rng() * total;
    for (var j = 0; j < items.length; j++) {
      r -= weights[j];
      if (r < 0) return items[j];
    }
    return items[items.length - 1];
  }

  // 套用一組效果；mult 只作用在數值，標籤一律原值加減後夾住
  // track = true(卡片選擇)時，記錄每個標籤第一次往上／往下變動的週數(延遲回收用；被上下限擋住沒變不算)
  function applyEffects(effects, mult, track) {
    if (!effects) return;
    var st = effects.stats || {};
    Object.keys(st).forEach(function (k) {
      if (!(k in S.stats)) return;
      S.stats[k] += roundAway(st[k] * mult);
    });
    var tg = effects.tags || {};
    Object.keys(tg).forEach(function (k) {
      var def = TAG_BY_ID[k];
      if (!def) return;
      var old = S.tags[k];
      var nv = clamp(old + tg[k], def.min, def.max);
      if (track && nv !== old) {
        var dir = nv > old ? 'up' : 'down';
        if (S.tagFirst[k][dir] == null) S.tagFirst[k][dir] = S.turn;
      }
      S.tags[k] = nv;
    });
  }

  // ---------- 事件佇列(v2.0)：每週 1–3 件事進待處理區，只能處理 1 件 ----------
  var QUEUE = RULES.queue || null;

  // 事件池：條件成立、沒用過的 once、過了冷卻、不在待處理區、不是情境鏈後續
  function eventPool(excludeIds) {
    var cooldown = RULES.cardCooldownTurns != null ? RULES.cardCooldownTurns : 8;
    var ctx = makeCtx(null);
    return DATA.cards.filter(function (c) {
      if (c.chainOnly || excludeIds.indexOf(c.id) >= 0) return false;
      if (S.usedOnce[c.id] || !checkAll(c.conditions, ctx)) return false;
      var last = S.lastSeen[c.id];
      return last === undefined || (S.turn - last) > cooldown;
    });
  }

  // 本週新進幾件：前期取 arrivalsEarly、第 lateFromPhase 階段起取 arrivalsLate；上限用 pHigh 的機率
  function arrivalsCount() {
    var late = currentPhase() >= QUEUE.lateFromPhase;
    var range = late ? QUEUE.arrivalsLate : QUEUE.arrivalsEarly;
    var ph = late ? QUEUE.pHighLate : QUEUE.pHighEarly;
    return rng() < ph ? range[1] : range[0];
  }

  function optionScore(o) {
    function sum(e) {
      var t = 0, st = (e && e.stats) || {};
      Object.keys(st).forEach(function (k) { t += st[k]; });
      return t;
    }
    if (o.chance) {
      var t = 0;
      o.chance.forEach(function (x) { t += x.p * sum(x.effects); });
      return t;
    }
    return sum(o.effects);
  }
  // 沒處理時被套用的「較差的選項」：四項數值加總較低者(機率選項用期望值)；一樣就右邊
  function worseSide(card) {
    return optionScore(card.left) < optionScore(card.right) ? 'left' : 'right';
  }

  // 套用一個事件的某個選項(手動或自動)；回傳機率結果編號(沒有機率就 null)
  function resolveEvent(card, side) {
    var opt = card[side];
    var outcome = null, effects = opt.effects;
    if (opt.chance && opt.chance.length) {
      var r = rng(), acc = 0;
      outcome = opt.chance.length - 1;
      for (var i = 0; i < opt.chance.length; i++) {
        acc += opt.chance[i].p;
        if (r < acc) { outcome = i; break; }
      }
      effects = opt.chance[outcome].effects;
    }
    S.lastSeen[card.id] = S.turn;
    if (card.once) S.usedOnce[card.id] = true;
    var sp = card.speaker || '';
    S.speakerCount[sp] = (S.speakerCount[sp] || 0) + 1;
    applyEffects(effects, 1, true);
    (opt.spawns || []).forEach(function (spw) {
      if (rng() < spw.p) S.sched.push({ week: S.turn + spw.afterWeeks, id: spw.card });
    });
    return outcome;
  }

  // 週初：電話沒接 → 套用較差的選項；新事件進來(延遲埋點優先)；待處理區最多 maxPending 件
  function weekStart() {
    S.autoNotices = [];
    S.queueFull = false;
    S.queue.slice().forEach(function (ev) {
      var mx = QUEUE.channels[ev.card.channel].maxAge;
      if (mx && ev.age >= mx) {
        S.queue.splice(S.queue.indexOf(ev), 1);
        var side = worseSide(ev.card);
        var oc = resolveEvent(ev.card, side);
        var opt = ev.card[side];
        S.autoNotices.push({ id: ev.card.id, speaker: ev.card.speaker, avatar: ev.card.avatar, side: side, label: opt.label,
                             result: oc == null ? opt.result : opt.chance[oc].result, outcome: oc });
      }
    });
    var n = arrivalsCount();
    var room = QUEUE.maxPending - S.queue.length;
    var added = [];
    var due = S.sched.filter(function (x) { return x.week <= S.turn; });
    due.sort(function (a, b) { return a.week !== b.week ? a.week - b.week : (a.id < b.id ? -1 : (a.id > b.id ? 1 : 0)); });
    due.forEach(function (x) {
      if (added.length < room) {
        added.push(CARD_BY_ID[x.id]);
        S.sched.splice(S.sched.indexOf(x), 1);
      }
    });
    while (added.length < Math.min(n, room)) {
      var ex = S.queue.map(function (e) { return e.card.id; }).concat(added.map(function (c) { return c.id; }));
      var cands = eventPool(ex);
      if (cands.length === 0) break;
      added.push(weightedPick(cands, cands.map(function (c) { return c.weight != null ? c.weight : 1; })));
    }
    S.queueFull = n > room;
    added.forEach(function (c) { S.queue.push({ card: c, age: 0 }); });
    if (S.queue.length === 0) S.queue.push({ card: fallbackCard(), age: 0 });   // 理論上不會發生；避免卡死
    S.card = S.queue[0].card;
    var late = currentPhase() >= QUEUE.weeklyCost.lateFromPhase;
    S.weeklyCost = late ? QUEUE.weeklyCost.late : QUEUE.weeklyCost.early;
    S.costRaised = late && currentPhase() === QUEUE.weeklyCost.lateFromPhase && S.turn === (YEAR.phaseStarts[QUEUE.weeklyCost.lateFromPhase - 1]);
  }

  // 沒有任何可抽的事件時：找最久沒出現的非後續卡(不使用亂數)
  function fallbackCard() {
    var best = null, bestLast = Infinity;
    DATA.cards.forEach(function (c) {
      if (c.chainOnly) return;
      var last = S.lastSeen[c.id] === undefined ? -Infinity : S.lastSeen[c.id];
      if (last < bestLast) { best = c; bestLast = last; }
    });
    return best;
  }

  // 週末：沒處理的升級一級(掛號信、群組每週扣升級效果，最高級之後持續套用)；扣每週營運成本；身份與特質的定期效果
  function weekEnd() {
    S.queue.forEach(function (ev) {
      ev.age += 1;
      if (!QUEUE.channels[ev.card.channel].maxAge) applyEffects(ev.card.escalation, 1, false);
    });
    var late = currentPhase() >= QUEUE.weeklyCost.lateFromPhase;
    var wc = {}; wc[QUEUE.weeklyCost.stat] = late ? QUEUE.weeklyCost.late : QUEUE.weeklyCost.early;
    applyEffects({ stats: wc }, 1, false);
    var owners = [IDENTITY_BY_ID[S.identity]].concat(S.traits.map(function (t) { return TRAIT_BY_ID[t]; }));
    owners.forEach(function (o) {
      if (!o || !o.perTurnEffects) return;
      var every = o.perTurnEvery || 1;
      if (S.turn % every === 0) applyEffects(o.perTurnEffects, 1, false);
    });
  }

  // 找出爆掉的數值(規格書 5-1)；沒爆回傳 null
  function findCause() {
    var order = RULES.breakOrderOnTie || [];
    var broken = [];
    DATA.stats.forEach(function (def) {
      var v = S.stats[def.id];
      if (v <= def.min) broken.push({ stat: def.id, bound: 'min', over: def.min - v });
      else if (v >= def.max) broken.push({ stat: def.id, bound: 'max', over: v - def.max });
    });
    if (broken.length === 0) return null;
    function rank(id) {
      var i = order.indexOf(id);
      return i < 0 ? 999 : i;
    }
    broken.sort(function (a, b) {
      if (b.over !== a.over) return b.over - a.over;   // 超出越多越優先
      return rank(a.stat) - rank(b.stat);               // 一樣多依 breakOrderOnTie
    });
    return { stat: broken[0].stat, bound: broken[0].bound };
  }

  // 決定結局(規格書 5-2 ~ 5-4)
  function pickEnding(cause) {
    var ctx = makeCtx(cause);
    var best = null;
    DATA.endings.forEach(function (e) {
      if (e.type !== 'special' && e.type !== 'year') return;
      if (!checkAll(e.conditions, ctx)) return;
      // 嚴格大於才換 → 同分時保留 JSON 中較前面的
      if (!best || (e.priority || 0) > (best.priority || 0)) best = e;
    });
    if (best) return best.id;

    // 沒有特殊結局：找 cause 對應的預設結局
    var def = null;
    DATA.endings.forEach(function (e) {
      if (def || e.type !== 'default') return;
      if (checkAll(e.conditions, ctx)) def = e;
    });
    return def ? def.id : null;
  }

  // ---------- 已解鎖結局(localStorage，每次讀寫都包 try/catch) ----------
  // key 一律用 meta.id(不可用 title，改名才不會清掉玩家紀錄)
  var STORAGE_KEY = 'unlocked-endings::' + ((DATA.meta && DATA.meta.id) || '');
  var memoryUnlocked = {};   // 存不進去時，至少記住這次開著頁面期間解鎖的

  function readUnlocked() {
    var list = [];
    try {
      var raw = window.localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) list = parsed;
      }
    } catch (e) {
      list = [];
    }
    Object.keys(memoryUnlocked).forEach(function (id) {
      if (list.indexOf(id) < 0) list.push(id);
    });
    // 只算資料裡還存在的結局
    return list.filter(function (id) { return !!ENDING_BY_ID[id]; });
  }

  function saveUnlocked(endingId) {
    if (!endingId) return;
    memoryUnlocked[endingId] = true;
    try {
      var list = readUnlocked();
      if (list.indexOf(endingId) < 0) list.push(endingId);
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
    } catch (e) {
      // 隱私模式或被封鎖：略過，不影響遊戲
    }
  }

  // ---------- 開局(規格書 4-1) ----------
  function drawTraits() {
    var weights = RULES.traitCountWeights || { '1': 1 };
    var counts = Object.keys(weights);
    var n = parseInt(weightedPick(counts, counts.map(function (k) { return weights[k]; })), 10);
    var picked = [];
    var all = DATA.traits || [];

    function conflicts(t) {
      if (picked.indexOf(t.id) >= 0) return true;
      return picked.some(function (pid) {
        var p = TRAIT_BY_ID[pid];
        return (t.excludes || []).indexOf(pid) >= 0 || (p.excludes || []).indexOf(t.id) >= 0;
      });
    }

    while (picked.length < n) {
      // 已經沒有可抽的特質就停止(避免無窮迴圈)
      if (!all.some(function (t) { return !conflicts(t); })) break;
      var t = all[Math.floor(rng() * all.length)];
      if (conflicts(t)) continue;   // 重複或互斥 → 重抽
      picked.push(t.id);
    }
    return picked;
  }

  function newGame(opts) {
    opts = opts || {};
    var seed = (opts.seed != null) ? (Number(opts.seed) >>> 0) : (Date.now() >>> 0);
    rng = mulberry32(seed);

    S = {
      seed: seed,
      turn: 1,
      stats: {},
      tags: {},
      identity: null,
      traits: [],
      gameOver: false,
      ending: null,
      cause: null,
      card: null,
      lastChoice: null,   // 最後一次選擇 { cardId, side }
      lastSeen: {},   // 卡片 id → 上次出現(被選擇)的週數
      usedOnce: {},   // once 卡已用過
      evalGrade: null,     // 評鑑等第
      evalFail: false,
      evalScore: null,
      evalDetail: null,    // 評鑑算式明細 [{key, value}]
      tagFirst: {},        // 標籤 id → { up: 週數|null, down: 週數|null }
      speakerCount: {},    // 說話者 → 出現次數(年度成績單)
      lowWater: null,      // 離上下限最近的一週 { stat, value, turn, dist }
      queue: [],           // 待處理區 [{ card, age }]
      sched: [],           // 延遲埋點 [{ week, id }]
      autoNotices: [],     // 本週初被自動處理的電話
      queueFull: false,
      afterChoice: null,
      weeklyCost: 0,
      costRaised: false
    };

    DATA.stats.forEach(function (s) { S.stats[s.id] = s.initial; });
    (DATA.tags || []).forEach(function (t) { S.tags[t.id] = t.initial; S.tagFirst[t.id] = { up: null, down: null }; });

    // 身份：有指定用指定的，沒有就平均抽
    if (opts.identity) {
      if (!IDENTITY_BY_ID[opts.identity]) throw new Error('未知的身份 id：' + opts.identity);
      S.identity = opts.identity;
    } else {
      var ids = DATA.identities;
      S.identity = ids[Math.floor(rng() * ids.length)].id;

    // 特質：有指定(非空陣列)用指定的，沒有就依規則抽
    if (opts.traits && opts.traits.length) {

      S.traits = drawTraits();
    }

    applyEffects(IDENTITY_BY_ID[S.identity].startEffects, 1);

    Object.keys(S.stats).forEach(function (k) {
      S.stats[k] = clamp(S.stats[k], range[0], range[1]);
    });

    // 情境鏈的第一張：在指定週數區間內隨機一週進入待處理區
    var starts = QUEUE.chainStarts || {};

      var lo = starts[cid][0], hi = starts[cid][1];
      S.sched.push({ week: lo + Math.floor(rng() * (hi - lo + 1)), id: cid });
    });

    return beginWeek();
  }

  // 新的一週開始：週初結算 → 檢查歸零／爆表
  function beginWeek() {
    weekStart();
    var cause = findCause();
    if (cause) return finish(cause);
    return getState();
  }

  // ---------- 一回合(規格書 4-5，順序嚴格固定) ----------
  function choose(side) {
    if (!S || S.gameOver || !S.card) return S ? getState() : null;
    if (side !== 'left' && side !== 'right') throw new Error("choose() 只接受 'left' 或 'right'");

    var card = S.card;
    var idx = -1;
    S.queue.forEach(function (e, i) { if (e.card.id === card.id) idx = i; });
    if (idx < 0) throw new Error('選的事件不在待處理區：' + card.id);

    // 1. 處理這一件(機率結果、卡片效果、延遲埋點)
    var outcome = resolveEvent(card, side);
    S.lastChoice = { cardId: card.id, side: side, outcome: outcome };
    S.queue.splice(idx, 1);
    S.afterChoice = copy(S.stats);   // 只含這個選擇的效果(畫面先顯示這個，再顯示週末結算)

    // 2. 週末結算：沒處理的升級、每週營運成本、身份與特質的定期效果
    weekEnd();

    // 3. Game Over 判斷(數值不先夾住)
    var cause = findCause();
    if (cause) return finish(cause);

    // 4. 評鑑週：判定等第並套用效果；fail 等第 = base 數值歸零
    if (YEAR && S.turn === YEAR.evalWeek && RULES['eval']) {
      evaluate();
      if (S.evalFail) {
        var base = RULES['eval'].base;
        S.stats[base] = STAT_BY_ID[base].min;
        return finish({ stat: base, bound: 'min' });
      }
      cause = findCause();
      if (cause) return finish(cause);
    }

    // 5. 離上下限最近的那一週
    updateLowWater();

    // 6. 學年結束
    if (YEAR && S.turn >= YEAR.weeks) return finish({ bound: 'yearEnd' });

    // 7. 下一週
    S.turn += 1;
    return beginWeek();
  }

  function finish(cause) {
    S.gameOver = true;
    S.cause = cause;
    S.ending = pickEnding(cause);
    S.card = null;
    saveUnlocked(S.ending);
    return getState();
  }

  // 評鑑(rules.eval)：分數 = base 數值 + Σ 權重 × 標籤(posOnly 的標籤只算正值)
  function evaluate() {
    var E = RULES['eval'];
    var score = S.stats[E.base];
    var detail = [{ key: E.base, value: S.stats[E.base] }];
    Object.keys(E.weights).forEach(function (k) {
      var v = S.tags[k];
      if ((E.posOnly || []).indexOf(k) >= 0) v = Math.max(0, v);
      var pts = E.weights[k] * v;
      score += pts;
      if (pts !== 0) detail.push({ key: k, value: pts });
    });
    S.evalScore = score;
    var g = null;
    for (var i = 0; i < E.grades.length; i++) { if (score >= E.grades[i].min) { g = E.grades[i]; break; } }
    S.evalGrade = g.grade;
    S.evalDetail = detail;
    S.evalFail = !!g.fail;
    var eff = g.effects || {};
    Object.keys(eff.stats || {}).forEach(function (k) {
      var v = eff.stats[k];
      S.stats[k] = v > 0 ? Math.min(g.cap != null ? g.cap : Infinity, S.stats[k] + v) : S.stats[k] + v;
    });
    Object.keys(eff.tags || {}).forEach(function (k) {
      var def = TAG_BY_ID[k];
      S.tags[k] = clamp(S.tags[k] + eff.tags[k], def.min, def.max);
    });
  }

  function gradeInfo(name) {
    var gs = (RULES['eval'] && RULES['eval'].grades) || [];
    for (var i = 0; i < gs.length; i++) if (gs[i].grade === name) return gs[i];
    return null;
  }

  function updateLowWater() {
    DATA.stats.forEach(function (def) {
      var v = S.stats[def.id];
      var dist = Math.min(v - def.min, def.max - v);
      if (!S.lowWater || dist < S.lowWater.dist) S.lowWater = { stat: def.id, value: v, turn: S.turn, dist: dist };
    });
  }

  // 任務是否達成(用目前狀態判斷；等第標 blocksMission 時不算)
  function missionDone() {
    var idt = IDENTITY_BY_ID[S.identity];
    if (!idt || !idt.mission) return null;
    var g = gradeInfo(S.evalGrade);
    return checkAll(idt.mission.conditions, makeCtx(null)) && !(g && g.blocksMission);
  }

  // ---------- 查詢 ----------
  function getState() {
    if (!S) return null;
    return {
      turn: S.turn,
      stats: copy(S.stats),
      tags: copy(S.tags),
      identity: S.identity,
      traits: S.traits.slice(),
      gameOver: S.gameOver,
      ending: S.ending,
      // 以下為額外資訊
      lastChoice: copy(S.lastChoice),
      cause: copy(S.cause),
      cardId: S.card ? S.card.id : null,
      queue: S.queue.map(function (e) { return { id: e.card.id, channel: e.card.channel, age: e.age, label: escalationLabel(e) }; }),
      autoNotices: copy(S.autoNotices),
      queueFull: S.queueFull,
      weeklyCost: S.weeklyCost,
      costRaised: S.costRaised,
      statsAfterChoice: copy(S.afterChoice || S.stats),
      seed: S.seed,
      // 學年制(VS v1)
      phase: currentPhase(),
      weeks: YEAR ? YEAR.weeks : null,
      evalWeek: YEAR ? YEAR.evalWeek : null,
      evalGrade: S.evalGrade,
      evalScore: S.evalScore,
      evalDetail: copy(S.evalDetail),
      speakerCount: copy(S.speakerCount),
      lowWater: copy(S.lowWater),
      tagFirst: copy(S.tagFirst),
      missionDone: missionDone()
    };
  }

  // 升級提示：age 0 沒有；之後依通道的 labels 逐級(超過最高級就停在最高級)
  function escalationLabel(ev) {
    if (!ev.age) return null;
    var labels = QUEUE.channels[ev.card.channel].labels || [];
    return labels.length ? labels[Math.min(ev.age, labels.length) - 1] : null;
  }

  // 選取待處理區的某一件(之後 choose 會處理它)
  function select(id) {
    if (!S || S.gameOver) return null;
    var found = null;
    S.queue.forEach(function (e) { if (e.card.id === id) found = e; });
    if (!found) throw new Error('待處理區沒有這件事：' + id);
    S.card = found.card;
    return copy(found.card);
  }

  function currentCard() {
    return S && S.card ? copy(S.card) : null;
  }

  // ---------- 除錯／測試用 ----------
  function jumpToTurn(n) {
    if (!S) return null;
    n = Math.floor(Number(n));
    if (!(n >= 1)) throw new Error('jumpToTurn(n)：n 必須是 ≥ 1 的整數');
    S.turn = n;
    return getState();
  }

  // 只覆寫有給的欄位；stats/tags 可只給部分 key。不做 Game Over 判斷、不夾住
  function setState(p) {
    if (!S || !p) return getState();
    if (p.stats) Object.keys(p.stats).forEach(function (k) { if (k in S.stats) S.stats[k] = p.stats[k]; });
    if (p.tags) Object.keys(p.tags).forEach(function (k) { if (k in S.tags) S.tags[k] = p.tags[k]; });
    if (p.turn != null) S.turn = p.turn;
    if (p.evalGrade !== undefined) S.evalGrade = p.evalGrade;
    return getState();
  }

  // 把目前卡片換成指定卡(不檢查條件)
  function forceCard(cardId) {
    if (!S) return null;
    var card = CARD_BY_ID[cardId];
    if (!card) throw new Error('未知的卡片 id：' + cardId);
    var idx = -1;
    if (S.card) S.queue.forEach(function (e, i) { if (e.card.id === S.card.id) idx = i; });
    if (idx >= 0) S.queue[idx] = { card: card, age: 0 };
    else S.queue.push({ card: card, age: 0 });
    S.card = card;
    return copy(card);
  }

  // 測試用：直接指定待處理區 [{ id, age }]，選取第一件
  function setQueue(list) {
    if (!S) return null;
    S.queue = list.map(function (x) {
      if (!CARD_BY_ID[x.id]) throw new Error('未知的卡片 id：' + x.id);
      return { card: CARD_BY_ID[x.id], age: x.age || 0 };
    });
    S.card = S.queue.length ? S.queue[0].card : null;
    return getState();
  }

  window.GameEngine = {
    newGame: newGame,
    getState: getState,
    currentCard: currentCard,
    choose: choose,
    jumpToTurn: jumpToTurn,
    setState: setState,
    forceCard: forceCard,
    select: select,
    setQueue: setQueue,
    // 給畫面用的輔助
    data: DATA,
    getEnding: function (id) { return ENDING_BY_ID[id] || null; },
    getUnlocked: readUnlocked,
    roundAway: roundAway,
    phaseOf: phaseOf,
    CONDITIONS: CONDITIONS
  };
})();

      var bar = el('div', 'stat-bar');
      var cells = [];
      for (var i = 0; i < 10; i++) { var c = el('i'); bar.appendChild(c); cells.push(c); }
      var dotSlot = el('div', 'stat-dot-slot');   // 拖曳預覽方塊(rules.previewDots 為 true 才會放東西)
      var mark = el('div', 'stat-mark');           // 選擇後的 ↑／↓
      box.setAttribute('aria-label', s.name);
      box.appendChild(label);
      box.appendChild(bar);
      box.appendChild(dotSlot);
      box.appendChild(mark);
      row.appendChild(box);
      nodes[s.id] = { box: box, bar: bar, cells: cells, dot: dotSlot, mark: mark, def: s };
    });
  }

  // 10 格方塊：亮格數 = ceil(值 / 10)，夾在 0–10；≤2 格紅色、≥9 格黃色
  function litCells(v, def) {
    var pct = (v - def.min) / (def.max - def.min) * 100;
    return Math.max(0, Math.min(10, Math.ceil(pct / 10)));
  }

  function paintStats(nodes, stats) {
    DATA.stats.forEach(function (s) {
      var n = nodes[s.id];
      var lit = litCells(stats[s.id], s);
      n.cells.forEach(function (c, i) { c.classList.toggle('on', i < lit); });
      n.bar.classList.toggle('low', lit <= 2);
      n.bar.classList.toggle('high', lit >= 9);
      n.bar.setAttribute('data-lit', lit);
      // 危險區：≤ 15 或 ≥ 85(以 0–100 的比例計)→ 數值條閃紅
      var pct = (stats[s.id] - s.min) / (s.max - s.min) * 100;
      n.box.classList.toggle('danger', pct <= DANGER_LOW || pct >= DANGER_HIGH);
    });
  }

  function renderStats() {
    paintStats(statNodes, E.getState().stats);
  }

  // 預覽方塊大小：用卡片原始數值(不乘倍率)。|變動| ≤ 6 小、≤ 13 中、> 13 大；0 或沒有就不顯示
  function dotSize(v) {
    var a = Math.abs(v || 0);
    if (a === 0) return null;
    if (a <= 6) return 's';
    if (a <= 13) return 'm';
    return 'l';
  }
  // 機率選項：每個數值取各種結果裡絕對值最大的(只看大小、不看方向，不洩漏機率)
  function previewMagnitudes(opt) {
    var out = {};
    var list = opt ? (opt.chance ? opt.chance.map(function (o) { return o.effects; }) : [opt.effects]) : [];
    list.forEach(function (e) {
      var st = (e && e.stats) || {};
      Object.keys(st).forEach(function (k) { if (Math.abs(st[k]) > Math.abs(out[k] || 0)) out[k] = st[k]; });
    });
    return out;
  }
  var PREVIEW_DOTS = !!(DATA.rules && DATA.rules.previewDots);   // 預設 false：只移動 ▶ 游標；true：恢復圓點預覽

  // 拖曳／滑鼠移到選項上：移動 ▶ 游標；rules.previewDots 為 true 時另外預覽會動的數值(大小)
  var hintSide = null;
  function showHint(side) {
    if (side === hintSide) return;
    hintSide = side;
    if (PREVIEW_DOTS) {
      var card = E.currentCard();
      var eff = side && card ? previewMagnitudes(card[side]) : {};
      DATA.stats.forEach(function (s) {
        var slot = statNodes[s.id].dot;
        slot.innerHTML = '';
        var size = side ? dotSize(eff[s.id]) : null;
        if (size) slot.appendChild(el('span', 'dot ' + size));
      });
    }
    if (side) setSel(side);
    $('btn-left').classList.toggle('hint', side === 'left');
    $('btn-right').classList.toggle('hint', side === 'right');
  }

  // ▶ 游標停在哪一個選項
  var selSide = 'left';
  function setSel(side) {
    selSide = side;
    $('btn-left').classList.toggle('sel', side === 'left');
    $('btn-right').classList.toggle('sel', side === 'right');
  }

  // ---------- 打字機效果 ----------
  var typing = false;
  var typeTimer = null;

  function startTyping(text) {
    clearInterval(typeTimer);
    var chars = Array.from(text || '');
    var box = $('card-text');
    box.innerHTML = '';
    var typed = el('span', 'typed');
    var rest = el('span', 'untyped');   // 還沒打出來的字先佔位(隱形)，版面不會跳動
    box.appendChild(typed);
    box.appendChild(rest);
    if (REDUCED || chars.length === 0) {
      typed.textContent = text || '';
      typingDone();
      return;
    }
    typing = true;
    $('screen-game').classList.add('typing');
    var i = 0;
    rest.textContent = text;
    typeTimer = setInterval(function () {
      i++;
      typed.textContent = chars.slice(0, i).join('');
      rest.textContent = chars.slice(i).join('');
      if (i >= chars.length) finishTyping();
    }, TYPE_MS);
  }

  // 點一下直接顯示全文
  function finishTyping() {
    if (!typing) return;
    clearInterval(typeTimer);
    var card = E.currentCard();
    var box = $('card-text');
    var typed = box.querySelector('.typed'), rest = box.querySelector('.untyped');
    if (typed && rest) { typed.textContent = card ? card.text : typed.textContent + rest.textContent; rest.textContent = ''; }
    typingDone();
  }

  function typingDone() {
    typing = false;
    $('screen-game').classList.remove('typing');
  }

  // ---------- 遊戲畫面(教室場景) ----------
  var UI = DATA.ui || {};
  var scene = null;
  var QCH = (DATA.rules.queue && DATA.rules.queue.channels) || {};
  var SCN = (DATA.rules && DATA.rules.scene) || {};
  var TUTORIAL = DATA.tutorial || [];
  var phase = 'idle';          // idle(平靜、等玩家點泡泡) | card(看對話框) | result(後果句) | overlay | eval | tutorial | transition
  var busy = false;
  var overlayShownAt = 0, resultShownAt = 0;
  var ovQueue = [];            // 週初要顯示的全螢幕過場(階段標題、電話自動處理)
  var afterOverlays = null;
  var phaseSeen = 0, noticeSeen = 0, evalShown = false;
  var viewQueue = [];          // 畫面上顯示的待辦(快照；選完之後不會馬上換成下一週的)
  var revealTimers = [];
  var bubbleBorn = {};         // 事件 id → 泡泡出現的時間
  var tutStep = 0;
  var TUT_KEY = 'kboss_tutorial_done';
  var tutorialDone = false;
  try { tutorialDone = window.localStorage.getItem(TUT_KEY) === '1'; } catch (e) { /* 讀不到儲存空間：每次都教 */ }
  var CALM_MS = 1000, POP_MS = 500;

  function fmt(tpl, vars) {
    return String(tpl || '').replace(/\{(\w+)\}/g, function (m, k) { return vars && vars[k] != null ? vars[k] : m; });
  }
  function chanInfo(ch) {
    var c = QCH[ch] || {};
    return { icon: c.icon || '', name: c.name || '', labels: c.labels || [], maxAge: c.maxAge, spot: c.spot, sprite: c.sprite };
  }
  function weeksUntil(target, turn) { return target - turn + 1; }

  // ----- 版面：場景依剩餘高度決定大小，下方對話框吃掉其餘 -----
  function layout() {
    if (!scene) return;
    var g = $('screen-game');
    var H = g.clientHeight, Wd = g.clientWidth;
    if (!H || !Wd) return;
    var used = $('hud').offsetHeight + $('stats-row').offsetHeight + (($('eval-bar').hidden) ? 0 : $('eval-bar').offsetHeight + 6) + 3 * 6;
    var dockMin = H < 640 ? 150 : (H < 760 ? 172 : 196);
    var maxH = H - used - dockMin;
    var sw = Math.min(Wd, Math.floor(maxH * 144 / 168));
    sw = Math.max(sw, 200);
    var wrap = $('scene-wrap');
    wrap.style.width = sw + 'px';
    wrap.style.height = Math.round(sw * 168 / 144) + 'px';
    var dpr = window.devicePixelRatio || 1;
    var k = Math.max(2, Math.floor(sw * dpr / 144));
    if (scene.k !== k) { scene.setScale(k); scene.k = k; }
    placeHotspots();
    scene.render();
  }
  window.addEventListener('resize', function () { if (currentScreen === 'game') layout(); if (currentScreen === 'start') layoutStart(); });

  // ----- 場景狀態：全部由遊戲數值與待辦區推出，畫面只讀 -----
  function worldView(stats, queue) {
    var v = {}, i, n;
    var par = stats[SCN.parents], tch = stats[SCN.staff], fin = stats[SCN.piggy], cmp = stats[SCN.docs];
    var win = queue.filter(function (q) { return chanInfo(q.channel).spot === 'window'; });
    var door = queue.filter(function (q) { return chanInfo(q.channel).spot === 'door'; });
    var base = par <= SCN.parentsLowAtMost ? 2 : (par <= SCN.parentsWarnAtMost ? 1 : 0);
    var maxAge = -1; win.forEach(function (q) { if (q.age > maxAge) maxAge = q.age; });
    n = Math.min(3, base + (win.length ? 1 + Math.min(maxAge, 2) : 0));
    v.parents = n;
    v.parentMood = maxAge >= 2 ? 2 : ((maxAge >= 1 || par <= SCN.parentsLowAtMost) ? 1 : 0);
    var lv = [0, 3, 6, 10], letters = 0;
    door.forEach(function (q) { letters += lv[Math.min(q.age, 3)]; });
    v.letters = Math.min(letters, 14);
    v.postman = door.length > 0;
    v.tmood = tch <= SCN.teacherSlumpAtMost ? 'slump' : (tch < SCN.teacherSweatBelow ? 'sweat' : 'calm');
    v.keeper = queue.length >= 3 ? 'sweat' : 'calm';
    v.piggy = fin <= 25 ? 0 : (fin >= 65 ? 2 : 1);
    v.docs = Math.max(0, Math.min(7, Math.round(cmp / 15)));
    v.sky = v.parentMood >= 1 ? 'C' : 'b';
    return v;
  }

  function setScene(stats, queue, revealed) {
    var v = worldView(stats, queue);
    v.bubbles = [];
    queue.forEach(function (q) {
      if (revealed && !revealed[q.id]) return;
      var ci = chanInfo(q.channel);
      v.bubbles.push({ id: q.id, spot: ci.spot, sprite: ci.sprite, born: bubbleBorn[q.id] || 0 });
    });
    scene.setView(v);
    placeHotspots();
    scene.render();
  }

  // 泡泡的點擊範圍：依場景大小換算成畫面座標(至少 48px)
  function placeHotspots() {
    var box = $('hot');
    if (!scene) return;
    box.innerHTML = '';
    var wrap = $('scene-wrap');
    var sw = wrap.clientWidth, sh = wrap.clientHeight;
    if (!sw) return;
    var view = scene.getView();
    var count = {};
    view.bubbles.forEach(function (b) {
      var i = count[b.spot] || 0; count[b.spot] = i + 1;
      var p = scene.bubblePos(b, i);
      if (!p) return;
      var cx = (p.x + 7.5) / 144 * sw, cy = (p.y + 6 - 16) / 168 * sh;
      var card = byId(DATA.cards, b.id);
      var btn = el('button', 'hotbtn');
      btn.type = 'button';
      btn.setAttribute('data-id', b.id);
      btn.setAttribute('aria-label', (card && card.speaker) || '');
      btn.style.left = cx + 'px'; btn.style.top = cy + 'px';
      btn.addEventListener('click', function (e) { e.stopPropagation(); selectBubble(b.id); });
      box.appendChild(btn);
    });
  }

  // ----- 下方對話框的三種樣子 -----
  function dockMode(mode) {
    $('dock-idle').hidden = mode !== 'idle';
    $('dock-card').hidden = mode !== 'card';
    $('card-result').hidden = mode !== 'result';
    $('card-speaker').hidden = mode === 'idle';
    $('card-chan').hidden = mode !== 'card';
    $('dock').classList.toggle('res', mode === 'result');
    $('screen-game').classList.toggle('showing-result', mode === 'result');
    $('btn-next').hidden = mode !== 'result';
    $('tap-hint').hidden = true;
  }

  function showIdle(msg) {
    phase = 'idle';
    clearTimeout(typeTimer); typing = false;
    var st = E.getState();
    dockMode('idle');
    $('idle-text').textContent = msg != null ? msg : ((UI.dock && UI.dock.tap) || '');
    var qc = UI.cost || {};
    var c = $('idle-cost');
    c.textContent = st.costRaised ? fmt(qc.increase, { N: st.weeklyCost }) : fmt(qc.weekly, { N: st.weeklyCost });
    c.classList.toggle('up', !!st.costRaised);
    var q = UI.queue || {};
    $('idle-note').textContent = st.queueFull ? (q.full || '') : (q.hint || '');
    $('idle-note').classList.toggle('full', !!st.queueFull);
    renderMission(st);
    scene.setView({ selected: null });
    scene.render();
  }

  function renderMission(st) {
    var idt = byId(DATA.identities, st.identity);
    var bar = $('mission-bar');
    if (!idt || !idt.mission) { bar.hidden = true; return; }
    var p = 1;
    (idt.mission.conditions || []).forEach(function (c) {
      var cur = c.type === 'stat' ? st.stats[c.stat] : (c.type === 'tag' ? st.tags[c.tag] : null);
      if (cur == null || !(c.value > 0)) return;
      p = Math.min(p, Math.max(0, Math.min(1, cur / c.value)));
    });
    bar.hidden = false;
    $('mission-text').textContent = idt.mission.label;
    $('mission-fill').style.width = Math.round(p * 100) + '%';
    bar.classList.toggle('done', !!st.missionDone);
  }

  // ----- 選一個泡泡：對話框打開那一件事 -----
  function selectBubble(id) {
    if (busy || (phase !== 'idle' && phase !== 'card')) return;
    if (typing) finishTyping();
    E.select(id);
    var card = E.currentCard();
    if (!card) return;
    phase = 'card';
    dockMode('card');
    var st = E.getState();
    var q = st.queue.filter(function (x) { return x.id === card.id; })[0];
    var ci = chanInfo(card.channel);
    $('card-speaker').textContent = card.speaker || '';
    var tag = $('card-chan');
    tag.textContent = ci.name + ((q && q.label) ? '｜' + q.label : '');
    tag.className = 'chan-tag t11 ' + (card.channel || '');
    ['left', 'right'].forEach(function (side) {
      var b = $('btn-' + side);
      b.textContent = card[side].label;
      if (card[side].chance) b.appendChild(pix('🎲', 22, 'dice'));   // 機率選項：後面加一顆小骰子
      b.classList.toggle('chance', !!card[side].chance);
    });
    setSel('left');
    scene.setView({ selected: id });
    scene.render();
    startTyping(card.text || '');
    updateDebugPanel();
  }

  // ----- 一週的開始：數值、待辦、過場、平靜 1 秒、泡泡依序冒出 -----
  function beginWeek(st, opts) {
    opts = opts || {};
    clearReveal();
    phase = 'overlay';
    $('screen-game').classList.remove('tutorial');
    renderStats();
    clearChangeMarks();
    if (opts.settle) markChanges(opts.settle, st.stats);   // 上週結算(每週開銷、升級)造成的變動
    var idt = byId(DATA.identities, st.identity);
    $('week-label').textContent = fmt((UI.week || ''), { N: st.turn, M: YEAR ? YEAR.weeks : '' });
    $('year-fill').style.width = YEAR ? Math.round(st.turn / YEAR.weeks * 100) + '%' : '0%';
    $('week-identity').textContent = idt ? idt.name : '';
    renderEvalBar(st);
    viewQueue = st.queue.map(function (q) { return { id: q.id, channel: q.channel, age: q.age }; });
    bubbleBorn = {};
    setScene(st.stats, viewQueue, {});
    showIdle('');
    layout();
    ovQueue = [];
    if (phaseOverlayNeeded(st)) { phaseSeen = st.phase; ovQueue.push({ kind: 'phase', p: st.phase, turn: st.turn }); }
    if (st.autoNotices && st.autoNotices.length && noticeSeen !== st.turn) { noticeSeen = st.turn; ovQueue.push({ kind: 'notice', items: st.autoNotices }); }
    afterOverlays = function () { afterIntro(st); };
    nextOverlay();
  }

  function afterIntro(st) {
    if (!tutorialDone && st.turn === 1) { startTutorial(st); return; }
    calmThenBubbles(st);
  }

  function clearReveal() { revealTimers.forEach(clearTimeout); revealTimers = []; }

  // 教室先平靜 1 秒，泡泡再一個一個冒出來(間隔約 0.5 秒)
  function calmThenBubbles(st) {
    phase = 'idle';
    showIdle('');
    var revealed = {};
    var delay = REDUCED ? 0 : CALM_MS;
    viewQueue.forEach(function (q, i) {
      var t = setTimeout(function () {
        revealed[q.id] = true;
        bubbleBorn[q.id] = performance.now();
        setScene(E.getState().stats, viewQueue, revealed);
        if (phase === 'idle') showIdle(null);
      }, delay + (REDUCED ? 0 : i * POP_MS));
      revealTimers.push(t);
    });
    revealed._all = true;
    window.__revealed = revealed;
  }

  // ----- 教室裡的教學：依序指向電話、門口、窗戶 -----
  function startTutorial(st) {
    tutStep = 0;
    phase = 'tutorial';
    $('screen-game').classList.add('tutorial');
    showTutStep();
  }
  function showTutStep() {
    var s = TUTORIAL[tutStep];
    if (!s) { endTutorial(); return; }
    phase = 'tutorial';
    overlayShownAt = Date.now();
    dockMode('idle');
    $('idle-text').textContent = (s.title ? s.title + '　' : '') + s.body;
    $('idle-cost').textContent = '';
    $('idle-note').textContent = '— 點一下繼續 —';
    $('mission-bar').hidden = true;
    var spot = s.target && QCH[s.target] ? QCH[s.target].spot : null;
    scene.setView({ ring: !!spot, focus: spot });
    $('stats-row').classList.toggle('tut-focus', s.target === 'stats');
    scene.render();
  }
  function endTutorial() {
    tutorialDone = true;
    try { window.localStorage.setItem(TUT_KEY, '1'); } catch (e) { /* 忽略 */ }
    scene.setView({ ring: false, focus: null });
    $('stats-row').classList.remove('tut-focus');
    $('screen-game').classList.remove('tutorial');
    calmThenBubbles(E.getState());
  }

  // ----- 全螢幕過場(階段標題、電話自動處理) -----
  function nextOverlay() {
    ['phase', 'notice'].forEach(function (n) { $(n + '-overlay').classList.remove('active'); });
    var ov = ovQueue.shift();
    if (!ov) {
      var f = afterOverlays; afterOverlays = null;
      if (f) f();
      return;
    }
    clearChangeMarks();
    phase = 'overlay';
    overlayShownAt = Date.now();
    if (ov.kind === 'phase') {
      var info = YEAR.phases[ov.p - 1] || {};
      var target = ov.p === 3 && EVAL ? YEAR.evalWeek : YEAR.weeks;
      $('phase-title').textContent = info.title || '';
      $('phase-sub').textContent = fmt(info.sub, { N: weeksUntil(target, ov.turn) });
      $('phase-overlay').classList.add('active');
    } else {
      var pa = UI.phoneAuto || {};
      $('notice-head').textContent = pa.headline || '';
      var box = $('notice-lines');
      box.innerHTML = '';
      ov.items.forEach(function (n) {
        var row = el('div');
        row.appendChild(el('div', 'nl-line', fmt(pa.line, { speaker: n.speaker, label: n.label })));
        if (n.result) row.appendChild(el('div', 'nl-res t11', n.result));
        box.appendChild(row);
      });
      $('notice-overlay').classList.add('active');
    }
  }

  function renderEvalBar(st) {
    var bar = $('eval-bar');
    if (!YEAR || !EVAL || st.phase !== 3 || st.turn > YEAR.evalWeek) { bar.hidden = true; return; }
    var n = weeksUntil(YEAR.evalWeek, st.turn);
    bar.textContent = n <= 1 ? '！本週評鑑！' : '！距離評鑑 ' + n + ' ' + UNIT + '！';
    bar.hidden = false;
  }
  function phaseOverlayNeeded(st) {
    if (!YEAR || !YEAR.phases) return false;
    return st.phase > phaseSeen && YEAR.phaseStarts.indexOf(st.turn) >= 0;
  }

  // ---------- 評鑑結果 ----------
  function gradeOf(name) {
    return ((EVAL && EVAL.grades) || []).filter(function (x) { return x.grade === name; })[0] || null;
  }
  function evalLabel(key, value) {
    var L = (EVAL && EVAL.labels) || {};
    return L[key + (value >= 0 ? '+' : '-')] || L[key] || key;
  }
  function showEvalOverlay(st) {
    evalShown = true;
    clearChangeMarks();
    var box = $('eval-lines');
    box.innerHTML = '';
    (st.evalDetail || []).forEach(function (d, i) {
      var row = el('div', 'eval-line' + (d.value < 0 ? ' neg' : ''));
      row.appendChild(el('span', null, evalLabel(d.key, d.value)));
      row.appendChild(el('span', 'n', (i > 0 && d.value > 0 ? '+' : '') + d.value));
      box.appendChild(row);
    });
    var total = el('div', 'eval-line eval-total');
    total.appendChild(el('span', null, '評鑑分數'));
    total.appendChild(el('span', 'n', String(st.evalScore)));
    box.appendChild(total);
    var g = $('eval-grade');
    g.textContent = st.evalGrade || '';
    var gd = gradeOf(st.evalGrade);
    g.classList.toggle('bad', !!(gd && gd.bad));
    $('eval-line').textContent = gd ? (gd.line || '') : '';
    phase = 'eval';
    overlayShownAt = Date.now();
    $('eval-overlay').classList.add('active');
  }
  function closeEvalOverlay() {
    $('eval-overlay').classList.remove('active');
    advance();
  }

  // ---------- 選擇與後果 ----------
  function commit(side) {
    if (busy || phase !== 'card') return;
    if (typing) { finishTyping(); return; }   // 全文顯示後才能選擇
    busy = true;
    showHint(side);
    var card = E.currentCard();
    var before = E.getState().stats;
    var opt = card && card[side];
    var result = opt && (opt.result || (opt.chance ? true : null));
    var doneId = card.id;
    setTimeout(function () {
      E.choose(side);
      busy = false;
      viewQueue = viewQueue.filter(function (q) { return q.id !== doneId; });
      if (result) showResult(card, side, result, before); else advance();
    }, 120);
  }

  function showResult(card, side, result, before) {
    var st = E.getState();
    var after = st.statsAfterChoice || st.stats;   // 先只顯示這個選擇的效果；週末結算在下一週畫面才標示
    phase = 'result';
    resultShownAt = Date.now();
    showHint(null);
    paintStats(statNodes, after);
    markChanges(before, after);
    maybeShake(before, after);
    var revealed = {}; viewQueue.forEach(function (q) { revealed[q.id] = true; });
    setScene(after, viewQueue, revealed);
    scene.setView({ selected: null });
    dockMode('result');
    $('card-speaker').textContent = card.speaker || '';
    $('result-choice').textContent = '你選了：' + card[side].label;
    var rt = $('result-text');
    rt.textContent = '';

    var t0 = performance.now(), swapped = false;
    scene.setView({ sky: 'm' });
    (function step() {
      var p = (performance.now() - t0) / 900;
      if (p >= 1) { scene.setView({ tint: 0 }); scene.render(); return; }
      var tint = p < 0.5 ? p * 2 * 0.5 : (1 - p) * 2 * 0.5;
      scene.setView({ tint: tint });
      if (p >= 0.5 && !swapped) { swapped = true; beginWeek(st, { settle: settle }); }
      scene.render();
      requestAnimationFrame(step);
    })();

  // 回傳 { rows: [[項目, 內容], …], comment }
  function reportData(info) {
    var st = info.state;
    var L = SUMMARY.labels || [];
    var rows = [];
    var W = YEAR ? YEAR.weeks : null;
    // 1. 任期
    rows.push([L[0], info.yearEnd ? ('撐完 ' + st.turn + ' ' + UNIT) : (W ? ('第 ' + st.turn + ' ' + UNIT + '倒下(' + st.turn + ' / ' + W + ')') : turnText(st.turn))]);
    // 2. 評鑑等第
    rows.push([L[1], st.evalGrade || '沒等到評鑑']);
    // 3. 任務：達成 ✔／未達成(目前值 / 門檻)
    var idt = byId(DATA.identities, st.identity);
    if (idt && idt.mission) {
      var c = (idt.mission.conditions || [])[0];
      var cur = '';
      if (c && c.type === 'stat') cur = statName(c.stat) + ' ' + st.stats[c.stat] + ' / ' + c.value;
      if (c && c.type === 'tag') cur = tagName(c.tag) + ' ' + st.tags[c.tag] + ' / ' + c.value;
      var done = info.yearEnd ? /^y_mission_/.test(st.ending || '') : false;
      rows.push([L[2], done ? '達成 ✔' : (info.yearEnd ? '未達成(' + cur + ')' : '沒機會驗收(' + cur + ')')]);
    }
    // 4. 出現最多次的說話者
    var sc = st.speakerCount || {}, who = null;
    Object.keys(sc).forEach(function (k) { if (who === null || sc[k] > sc[who]) who = k; });
    if (who !== null) rows.push([L[3], who + ' ×' + sc[who]]);
    // 5. 離上下限最近的那一週
    var lw = st.lowWater;
    if (lw) {
      var def = byId(DATA.stats, lw.stat);
      var low = def && (lw.value - def.min) <= (def.max - lw.value);
      rows.push([L[4], turnText(lw.turn) + '，' + statName(lw.stat) + (low ? '剩 ' : '衝到 ') + lw.value]);
    }
    // 年度評價：絕對值最大的標籤(同分取資料順序在前的)，依正負取句；全部 0 用通用句
    var best = null;
    (DATA.tags || []).forEach(function (t) {
      var v = st.tags[t.id] || 0;
      if (v !== 0 && (best === null || Math.abs(v) > Math.abs(st.tags[best]))) best = t.id;
    });
    var comments = SUMMARY.comments || {};
    var comment = best === null ? (SUMMARY.commentZero || '') : (comments[best + (st.tags[best] > 0 ? '+' : '-')] || '');
    return { rows: rows, comment: comment };
  }
