:root {
  color-scheme: dark;
  --k: #0b0b14;   /* 黑 */
  --w: #f4f4f4;   /* 白 */
  --r: #e43b44;   /* 紅 */
  --y: #feae34;   /* 黃 */
  --g: #63c74d;   /* 綠 */
  --b: #3a6ea5;   /* 藍 */
  --s: #8b9bb4;   /* 灰 */
  --d: #262b44;   /* 深藍灰 */
  --px: "KBoss Pixel", monospace;
  /* ▶ 游標：一格一格的像素三角形 */
  --tri-r: polygon(5px 2px,7px 2px,7px 4px,9px 4px,9px 6px,11px 6px,11px 8px,13px 8px,13px 10px,15px 10px,15px 12px,13px 12px,13px 14px,11px 14px,11px 16px,9px 16px,9px 18px,7px 18px,7px 20px,5px 20px);
  --tri-l: polygon(17px 2px,15px 2px,15px 4px,13px 4px,13px 6px,11px 6px,11px 8px,9px 8px,9px 10px,7px 10px,7px 12px,9px 12px,9px 14px,11px 14px,11px 16px,13px 16px,13px 18px,15px 18px,15px 20px,17px 20px);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }

html, body {
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;       /* 防止下拉重新整理、橡皮筋捲動 */
  background: var(--k);
  color: var(--w);
  font-family: var(--px);
  font-size: 22px;
  line-height: 33px;
  -webkit-font-smoothing: none;
  font-smooth: never;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}

/* 整個 App 固定填滿畫面，上下左右避開瀏海與 Home 條 */
#app {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  padding-top: calc(env(safe-area-inset-top) + 11px);
  padding-bottom: calc(env(safe-area-inset-bottom) + 11px);
  padding-left: calc(env(safe-area-inset-left) + 11px);
  padding-right: calc(env(safe-area-inset-right) + 11px);
  max-width: 520px;
  margin: 0 auto;
  background: var(--k);
}
/* CRT 掃描線(透明度 5%，不擋點擊) */
.crt { position: fixed; inset: 0; pointer-events: none; z-index: 200;
  background: repeating-linear-gradient(0deg, rgba(255, 255, 255, .05) 0 1px, transparent 1px 3px); }

.screen { display: none; flex: 1; flex-direction: column; min-height: 0; gap: 11px; }
.screen.active { display: flex; }

/* 字級(只用 11 的倍數) */
.t11 { font-size: 11px; line-height: 16px; }
.t22 { font-size: 22px; line-height: 33px; }
.t33 { font-size: 33px; line-height: 44px; }
.t44 { font-size: 44px; line-height: 55px; }

button, a.opt { font-family: var(--px); font-size: inherit; line-height: inherit; color: inherit; background: none; border: none;
  cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none; text-align: left; text-decoration: none; }

/* 螢幕閱讀器用(畫面上不顯示) */
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* emoji 畫到 16×16 canvas 再放大 → 像素圖 */
canvas.pix { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }

/* 雙線白框對話框 */
.box { border: 4px solid var(--w); box-shadow: inset 0 0 0 3px var(--k), inset 0 0 0 5px var(--w);
  background: var(--k); padding: 16px 14px; position: relative; }
.box.res { border-color: var(--y); box-shadow: inset 0 0 0 3px var(--k), inset 0 0 0 5px var(--y); }

/* 閃爍 */
@keyframes bl { 50% { opacity: 0; } }
.blink { animation: bl 1s steps(1) infinite; }

/* 選單：▶ 游標 */
.menu { display: grid; gap: 4px; flex: none; }
.opt { display: flex; align-items: center; gap: 8px; padding: 4px 6px; width: 100%; color: var(--w); min-width: 0; overflow-wrap: anywhere; }
.opt::before { content: ""; flex: none; width: 22px; height: 22px; }
.opt.sel { background: var(--d); }
.opt.sel::before { background: var(--y); clip-path: var(--tri-r); animation: bl 1s steps(1) infinite; }

/* ========== 開局畫面(PRESS START) ========== */
.title { text-align: center; color: var(--y); text-shadow: 4px 4px 0 var(--r); margin-top: 33px; overflow-wrap: anywhere; }
.start-top { flex: none; max-height: 100%; overflow-y: auto; }
.slot { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: start; }
.slot .k { color: var(--s); }
.slot .v { color: var(--g); min-width: 0; overflow-wrap: anywhere; }
.trait-item + .trait-item::before { content: "・"; }
.start-notes { color: var(--s); margin-top: 11px; overflow-wrap: anywhere; }
.start-notes > div + div { margin-top: 4px; }
/* 抽身份與特質：格子閃爍(≤1 秒) */
.rolling { position: relative; color: transparent !important; }
.rolling::after { content: ""; position: absolute; left: 0; top: 6px; bottom: 6px; width: min(100%, 154px);
  background: repeating-linear-gradient(90deg, var(--g) 0 18px, transparent 18px 22px); animation: roll .12s steps(1) infinite; }
@keyframes roll { 50% { background-position: 11px 0; opacity: .4; } }
.spacer { flex: 1; min-height: 0; }
.press { display: flex; justify-content: center; align-items: center; gap: 8px; width: 100%; color: var(--w);
  text-align: center; flex: none; animation: bl 1.2s steps(1) infinite; }
.press::before { content: ""; width: 22px; height: 22px; background: var(--w); clip-path: var(--tri-r); }
.sub { text-align: center; color: var(--s); flex: none; width: 100%; padding: 4px 0; text-align: center; }

/* ========== 遊戲畫面 ========== */
/* 上方狀態列：像素圖示 + 名稱 + 10 格數值條 */
.stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; flex: none; }
.stat { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 0; position: relative; min-width: 0; }
.stat-label { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; max-width: 100%; }
.stat-icon { width: 32px; height: 32px; }
.stat-name { font-size: 11px; line-height: 11px; color: var(--s); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.stat-bar { display: grid; grid-template-columns: repeat(10, 6px); gap: 2px; }
.stat-bar i { height: 9px; background: var(--d); }
.stat-bar i.on { background: var(--g); }
.stat-bar.low i.on { background: var(--r); }
.stat-bar.high i.on { background: var(--y); }
/* (VS v1：拖曳時的圓點預覽已移除，選擇前看不到哪些數值會動) */
/* 危險區(≤15 或 ≥85)：數值條持續閃紅 */
.stat.danger .stat-bar i.on { background: var(--r); }
.stat.danger .stat-bar { animation: danger .6s steps(1) infinite; }
@keyframes danger { 50% { opacity: .25; } }
/* 單一數值一次掉 ≥ 13：整個畫面震動 0.3 秒 */
@keyframes shake { 0% { transform: translate(0, 0); } 20% { transform: translate(-6px, 2px); } 40% { transform: translate(6px, -2px); }
  60% { transform: translate(-4px, -2px); } 80% { transform: translate(4px, 2px); } 100% { transform: translate(0, 0); } }
#app.shake { animation: shake .3s steps(5); }
/* 選擇後：有變動的數值框起來、閃爍 2 次、顯示 ↑／↓ */
.stat.changed { outline: 2px solid var(--y); outline-offset: 1px; }
.stat.changed .stat-bar { animation: flash .3s steps(1) 2; }
@keyframes flash { 50% { opacity: 0; } }
.stat-mark { position: absolute; right: 2px; top: 2px; }
.stat-arrow { font-size: 22px; line-height: 22px; color: var(--y); }

.week { display: flex; justify-content: space-between; gap: 11px; color: var(--s); flex: none; }
.week > span:last-child { text-align: right; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.week-left { color: var(--w); }
/* 第三階段：評鑑倒數警示條(紅底黑字、外框閃爍) */
.eval-bar { flex: none; background: var(--r); color: var(--k); text-align: center; padding: 2px 6px;
  outline: 3px solid var(--y); animation: evalbar 1s steps(1) infinite; }
@keyframes evalbar { 50% { outline-color: var(--k); } }
/* 機率選項：選項後面的小骰子 */
.opt .dice { flex: none; margin-left: auto; opacity: .9; }
.res-tag { color: var(--s); display: block; }
/* 過場標題、評鑑結果(全螢幕，點一下繼續) */
.stat-dot-slot { position: absolute; left: 2px; top: 2px; width: 14px; height: 14px; display: flex; align-items: center; justify-content: center; }
.dot { background: var(--w); }
.dot.s { width: 6px; height: 6px; }
.dot.m { width: 10px; height: 10px; }
.dot.l { width: 14px; height: 14px; }
.overlay { position: absolute; inset: -11px; z-index: 20; background: var(--k); display: none; flex-direction: column;
  align-items: stretch; justify-content: center; gap: 22px; padding: 11px; text-align: center; }
.overlay.active { display: flex; }
.overlay-title { color: var(--y); text-shadow: 3px 3px 0 var(--r); overflow-wrap: anywhere; }
.overlay-sub { color: var(--w); overflow-wrap: anywhere; }
.overlay-next { color: var(--s); }
.eval-lines { text-align: left; display: grid; gap: 4px; }
.eval-line { display: flex; justify-content: space-between; gap: 11px; }
.eval-line .n { color: var(--y); white-space: nowrap; }
.eval-line.neg .n { color: var(--r); }
.eval-total { border-top: 2px dashed var(--s); padding-top: 6px; }
.eval-grade { color: var(--y); }
.eval-grade.bad { color: var(--r); }
#screen-game { position: relative; }

/* 中間區域(#card)：數值列和選單之間整塊都可以開始拖曳，拖曳時對話框跟著移動 */
.card-area { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 11px; }
.card { touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; will-change: transform; }
.card:active { cursor: grabbing; }
.dialog { flex: none; margin-top: 14px; }
.nameplate { position: absolute; left: 14px; top: -14px; background: var(--k); border: 4px solid var(--w); padding: 2px 10px;
  color: var(--y); max-width: calc(100% - 28px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dlg { display: flex; gap: 12px; align-items: flex-start; padding-top: 8px; }
.avatar { flex: none; width: 64px; height: 64px; overflow: hidden; }
.dlg p { min-width: 0; overflow-wrap: anywhere; }
.untyped { visibility: hidden; }
.type-cursor { color: var(--y); animation: bl 1s steps(1) infinite; }
.typing .type-cursor { visibility: hidden; }
.showing-result .type-cursor { visibility: hidden; }
.res-text { color: var(--y); overflow-wrap: anywhere; }

/* 下方：選項選單；左右滑動提示 */
.typing #reply .opt.sel::before { visibility: hidden; }
.tap-row { flex: none; min-height: 16px; display: flex; justify-content: center; }
.tap-hint, #btn-next { color: var(--s); text-align: center; }
#btn-next { width: 100%; }
.tap-hint { display: flex; align-items: center; gap: 4px; }
.tap-hint::before, .tap-hint::after { content: ""; width: 22px; height: 22px; transform: scale(.5); background: var(--s); }
.tap-hint::before { clip-path: var(--tri-l); }
.tap-hint::after { clip-path: var(--tri-r); }

/* ========== GAME OVER ========== */
.end-top { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 11px; }
.end-top > * { flex: none; }
.go { text-align: center; color: var(--r); letter-spacing: 4px; }
.etitle { text-align: center; color: var(--y); overflow-wrap: anywhere; }
.ecause { text-align: center; color: var(--s); margin-top: -8px; }
.end-text { overflow-wrap: anywhere; }
.last { border: 2px dashed var(--s); padding: 8px 10px; color: var(--s); overflow-wrap: anywhere; }
.last-card-label { color: var(--w); display: block; }
.last-card-speaker::after { content: "："; }
.last-card-result { color: var(--y); }
.cont { display: flex; justify-content: space-between; gap: 11px; color: var(--s); }
.go.clear { color: var(--g); }
/* 年度成績單 */
.report { display: grid; gap: 2px; }
.report-head { color: var(--y); }
.report-row { display: flex; justify-content: space-between; gap: 11px; }
.report-row .k { color: var(--s); white-space: nowrap; }
.report-row .v { text-align: right; overflow-wrap: anywhere; min-width: 0; }
.report-comment { color: var(--y); margin-top: 6px; overflow-wrap: anywhere; }
.end-buttons { padding: 11px 10px; }
.cont-n { color: var(--r); margin-left: 8px; }
.btn-row { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; }
.btn-row .opt { justify-content: center; padding: 4px 2px; white-space: nowrap; }
.btn-row .opt::before { display: none; }
.btn-row .opt:hover, .btn-row .opt:focus-visible { background: var(--d); }

/* ========== 結局圖鑑 ========== */
.gallery-head { display: flex; justify-content: space-between; align-items: baseline; gap: 11px; flex: none; }
.gallery-title { color: var(--y); text-shadow: 3px 3px 0 var(--r); }
.gallery-count { color: var(--s); white-space: nowrap; }
.gallery-list { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  display: flex; flex-direction: column; gap: 6px; }
.gallery-item { display: flex; justify-content: space-between; align-items: center; gap: 11px; padding: 2px 6px; flex: none; }
.gallery-item-title { color: var(--y); overflow-wrap: anywhere; min-width: 0; }
.gallery-item.locked .gallery-item-title { color: var(--s); letter-spacing: 4px; }
.gallery-item-hint { color: var(--s); white-space: nowrap; font-size: 11px; line-height: 16px; }

/* ========== 分享圖遮罩(無法用系統分享時) ========== */
.share-overlay { position: fixed; inset: 0; z-index: 100; background: var(--k); color: var(--w);
  display: none; flex-direction: column; align-items: center; justify-content: center; gap: 11px;
  padding: calc(env(safe-area-inset-top) + 11px) calc(env(safe-area-inset-right) + 11px)
           calc(env(safe-area-inset-bottom) + 11px) calc(env(safe-area-inset-left) + 11px); }
.share-overlay.active { display: flex; }
.share-tip { color: var(--y); text-align: center; }
.share-img-wrap { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
.share-img { max-width: 100%; max-height: 100%; object-fit: contain; border: 4px solid var(--w);
  -webkit-touch-callout: default; user-select: auto; -webkit-user-select: auto; }
.share-sub { color: var(--s); text-align: center; }
#btn-share-close { width: auto; }

/* 錯誤訊息(資料讀不到時) */
.fatal { margin: auto; padding: 20px; text-align: center; }

/* 動態減少：關掉閃爍與動畫 */
@media (prefers-reduced-motion: reduce) {
  .blink, .press, .opt.sel::before, .type-cursor, .stat.changed .stat-bar, .rolling::after,
  .stat.danger .stat-bar, #app.shake, .eval-bar { animation: none !important; }
  .stat.danger { outline: 2px solid var(--r); }
}

/* ========== 除錯模式(只有 ?debug=1 才會由程式建立) ========== */
.dbg-panel {
  position: fixed;
  left: calc(env(safe-area-inset-left) + 6px);
  top: calc(env(safe-area-inset-top) + 92px);
  z-index: 150;
  max-width: 62vw;
  max-height: 60vh;
  overflow-y: auto;
  background: rgba(20, 20, 20, 0.82);
  color: #e8ffe8;
  font: 11px/1.45 ui-monospace, Menlo, Consolas, monospace;
  border-radius: 8px;
  padding: 6px 8px;
}
.dbg-panel.collapsed .dbg-body { display: none; }
.dbg-panel button { font: 11px ui-monospace, monospace; padding: 2px 6px; border-radius: 4px; background: #555; color: #fff; }
.dbg-panel input { width: 52px; font-size: 12px; }
.dbg-row { display: flex; gap: 6px; align-items: center; margin-top: 4px; }
.dbg-start { background: #222; color: #e8ffe8; border-radius: 10px; padding: 8px 10px; font: 12px/1.5 ui-monospace, monospace; margin-top: 11px; }
.dbg-start select { font-size: 13px; max-width: 100%; }
.dbg-start label { display: inline-flex; align-items: center; gap: 3px; margin: 2px 8px 2px 0; }

<div id="app">

    <div class="box menu t22 end-buttons">

<script>
/* =====================================================================
 * 第一部分：遊戲引擎(不碰畫面)
 * 規則來源：stage0-spec.md 第 3–5 節
 * 對外介面：window.GameEngine
 * ===================================================================== */
(function () {
  'use strict';

  // ---------- 讀取內嵌資料 ----------
  var DATA = null;
  try {
    DATA = JSON.parse(document.getElementById('game-data').textContent);
  } catch (e) {
    DATA = null;
  }
  if (!DATA || !DATA.stats || !DATA.cards || !DATA.endings) {
    window.GameEngine = null;
    return;
  }

  var RULES = DATA.rules || {};

  // ---------- 小工具 ----------

  // 可指定種子的亂數產生器(mulberry32)，回傳 0 ≤ x < 1
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // 四捨五入一律遠離零：2.5→3、-2.5→-3(不可直接用 Math.round)
  function roundAway(x) {
    return Math.sign(x) * Math.round(Math.abs(x));
  }

  function clamp(v, lo, hi) {
    return Math.max(lo, Math.min(hi, v));
  }

  function copy(obj) {
    return obj == null ? obj : JSON.parse(JSON.stringify(obj));
  }

  // 依 id 建立查詢表
  function indexById(list) {
    var map = {};
    (list || []).forEach(function (item) { map[item.id] = item; });
    return map;
  }

  var STAT_BY_ID = indexById(DATA.stats);
  var TAG_BY_ID = indexById(DATA.tags);
  var IDENTITY_BY_ID = indexById(DATA.identities);
  var TRAIT_BY_ID = indexById(DATA.traits);
  var CARD_BY_ID = indexById(DATA.cards);
  var ENDING_BY_ID = indexById(DATA.endings);

  // ---------- 比較運算子 ----------
  var OPS = {
    '>=': function (a, b) { return a >= b; },
    '<=': function (a, b) { return a <= b; },
    '>':  function (a, b) { return a > b; },
    '<':  function (a, b) { return a < b; },
    '==': function (a, b) { return a === b; }
  };

  // ---------- 條件判斷對照表(規格書 3.1) ----------
  // 新增條件類型：在這裡加一個函式即可(build.py 的 KNOWN_CONDITIONS 也要加)
  // ctx = { identity, traits, stats, tags, turn, cause }
  var CONDITIONS = {
    identity: function (c, ctx) {
      return (c.any || []).indexOf(ctx.identity) >= 0;
    },
    trait: function (c, ctx) {
      if (c.any && !c.any.some(function (t) { return ctx.traits.indexOf(t) >= 0; })) return false;
      if (c.none && c.none.some(function (t) { return ctx.traits.indexOf(t) >= 0; })) return false;
      return true;
    },
    tag: function (c, ctx) {
      var op = OPS[c.op];
      return !!op && op(ctx.tags[c.tag], c.value);
    },
    stat: function (c, ctx) {
      var op = OPS[c.op];
      return !!op && op(ctx.stats[c.stat], c.value);
    },
    minTurn: function (c, ctx) {
      return ctx.turn >= c.value;
    },
    // 僅結局使用；卡片判斷時 ctx.cause 為 null，一律不成立。bound=yearEnd 代表撐完學年
    cause: function (c, ctx) {
      if (!ctx.cause) return false;
      if (c.bound === 'yearEnd') return ctx.cause.bound === 'yearEnd';
      return ctx.cause.stat === c.stat && ctx.cause.bound === c.bound;
    },
    // 學年階段(1–4)
    phase: function (c, ctx) {
      return (c.any || []).indexOf(ctx.phase) >= 0;
    },
    // 評鑑等第(還沒評鑑時為 null)
    evalGrade: function (c, ctx) {
      return (c.any || []).indexOf(ctx.evalGrade) >= 0;
    },
    // 任一子條件成立
    or: function (c, ctx) {
      return (c.conditions || []).some(function (x) {
        var fn = CONDITIONS[x.type];
        return !!fn && fn(x, ctx);
      });
    },
    // 延遲回收：標籤「第一次往 dir 方向變動」後已過 minWeeks 週(只記卡片選擇造成的變動)
    tagSince: function (c, ctx) {
      var f = ctx.tagFirst[c.tag] && ctx.tagFirst[c.tag][c.dir];
      return f != null && (ctx.turn - f) >= c.minWeeks;
    }
  };

  function checkAll(conditions, ctx) {
    var list = conditions || [];
    for (var i = 0; i < list.length; i++) {
      var fn = CONDITIONS[list[i].type];
      if (!fn) return false;            // 未知類型視為不成立(build 時就會擋下)
      if (!fn(list[i], ctx)) return false;
    }
    return true;
  }

  // ---------- 遊戲狀態 ----------
  var S = null;      // 目前這一局
  var rng = Math.random;

  function makeCtx(cause) {
    return {
      identity: S.identity,
      traits: S.traits,
      stats: S.stats,
      tags: S.tags,
      turn: S.turn,
      phase: currentPhase(),
      evalGrade: S.evalGrade,
      tagFirst: S.tagFirst,
      cause: cause || null
    };
  }

  // 學年設定(rules.year)；沒有設定時 phase = 0、不會有學年結束與評鑑
  var YEAR = RULES.year || null;
  function phaseOf(turn) {
    if (!YEAR) return 0;
    var p = 0;
    (YEAR.phaseStarts || []).forEach(function (w) { if (turn >= w) p++; });
    return p;
  }
  function currentPhase() { return phaseOf(S.turn); }

  // 依權重抽一個(weights 與 items 一一對應)
  function weightedPick(items, weights) {
    var total = 0;
    for (var i = 0; i < weights.length; i++) total += weights[i];
    var r = rng() * total;
    for (var j = 0; j < items.length; j++) {
      r -= weights[j];
      if (r < 0) return items[j];
    }
    return items[items.length - 1];
  }

  // 套用一組效果；mult 只作用在數值，標籤一律原值加減後夾住
  // track = true(卡片選擇)時，記錄每個標籤第一次往上／往下變動的週數(延遲回收用；被上下限擋住沒變不算)
  function applyEffects(effects, mult, track) {
    if (!effects) return;
    var st = effects.stats || {};
    Object.keys(st).forEach(function (k) {
      if (!(k in S.stats)) return;
      S.stats[k] += roundAway(st[k] * mult);
    });
    var tg = effects.tags || {};
    Object.keys(tg).forEach(function (k) {
      var def = TAG_BY_ID[k];
      if (!def) return;
      var old = S.tags[k];
      var nv = clamp(old + tg[k], def.min, def.max);
      if (track && nv !== old) {
        var dir = nv > old ? 'up' : 'down';
        if (S.tagFirst[k][dir] == null) S.tagFirst[k][dir] = S.turn;
      }
      S.tags[k] = nv;
    });
  }

  // 難度爬升倍率：第 startTurn 週起乘上 multiplier
  function rampMultiplier(turn) {
    var ramp = RULES.ramp;
    if (ramp && ramp.enabled && turn >= ramp.startTurn) return ramp.multiplier;
    return 1;
  }

  // 抽卡(規格書 4-3)
  function drawCard() {
    var cooldown = RULES.cardCooldownTurns != null ? RULES.cardCooldownTurns : 15;
    var ctx = makeCtx(null);

    function notUsedAndAllowed(c) {
      return !S.usedOnce[c.id] && checkAll(c.conditions, ctx);
    }

    var candidates = DATA.cards.filter(function (c) {
      if (!notUsedAndAllowed(c)) return false;
      var last = S.lastSeen[c.id];
      return last === undefined || (S.turn - last) > cooldown;
    });

    if (candidates.length > 0) {
      return weightedPick(candidates, candidates.map(function (c) {
        return c.weight != null ? c.weight : 1;
      }));
    }

    // 候選為空：忽略冷卻，抽最久沒出現的卡(條件與 once 仍要成立；連這也沒有就從全部卡片找)
    var pool = DATA.cards.filter(notUsedAndAllowed);
    if (pool.length === 0) pool = DATA.cards.slice();
    var best = null;
    var bestLast = Infinity;
    pool.forEach(function (c) {
      var last = S.lastSeen[c.id] === undefined ? -Infinity : S.lastSeen[c.id];
      if (last < bestLast) { best = c; bestLast = last; }
    });
    return best || pool[0];
  }

  // 找出爆掉的數值(規格書 5-1)；沒爆回傳 null
  function findCause() {
    var order = RULES.breakOrderOnTie || [];
    var broken = [];
    DATA.stats.forEach(function (def) {
      var v = S.stats[def.id];
      if (v <= def.min) broken.push({ stat: def.id, bound: 'min', over: def.min - v });
      else if (v >= def.max) broken.push({ stat: def.id, bound: 'max', over: v - def.max });
    });
    if (broken.length === 0) return null;
    function rank(id) {
      var i = order.indexOf(id);
      return i < 0 ? 999 : i;
    }
    broken.sort(function (a, b) {
      if (b.over !== a.over) return b.over - a.over;   // 超出越多越優先
      return rank(a.stat) - rank(b.stat);               // 一樣多依 breakOrderOnTie
    });
    return { stat: broken[0].stat, bound: broken[0].bound };
  }

  // 決定結局(規格書 5-2 ~ 5-4)
  function pickEnding(cause) {
    var ctx = makeCtx(cause);
    var best = null;
    DATA.endings.forEach(function (e) {
      if (e.type !== 'special' && e.type !== 'year') return;
      if (!checkAll(e.conditions, ctx)) return;
      // 嚴格大於才換 → 同分時保留 JSON 中較前面的
      if (!best || (e.priority || 0) > (best.priority || 0)) best = e;
    });
    if (best) return best.id;

    // 沒有特殊結局：找 cause 對應的預設結局
    var def = null;
    DATA.endings.forEach(function (e) {
      if (def || e.type !== 'default') return;
      if (checkAll(e.conditions, ctx)) def = e;
    });
    return def ? def.id : null;
  }

  // ---------- 已解鎖結局(localStorage，每次讀寫都包 try/catch) ----------
  // key 一律用 meta.id(不可用 title，改名才不會清掉玩家紀錄)
  var STORAGE_KEY = 'unlocked-endings::' + ((DATA.meta && DATA.meta.id) || '');
  var memoryUnlocked = {};   // 存不進去時，至少記住這次開著頁面期間解鎖的

  function readUnlocked() {
    var list = [];
    try {
      var raw = window.localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) list = parsed;
      }
    } catch (e) {
      list = [];
    }
    Object.keys(memoryUnlocked).forEach(function (id) {
      if (list.indexOf(id) < 0) list.push(id);
    });
    // 只算資料裡還存在的結局
    return list.filter(function (id) { return !!ENDING_BY_ID[id]; });
  }

  function saveUnlocked(endingId) {
    if (!endingId) return;
    memoryUnlocked[endingId] = true;
    try {
      var list = readUnlocked();
      if (list.indexOf(endingId) < 0) list.push(endingId);
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
    } catch (e) {
      // 隱私模式或被封鎖：略過，不影響遊戲
    }
  }

  // ---------- 開局(規格書 4-1) ----------
  function drawTraits() {
    var weights = RULES.traitCountWeights || { '1': 1 };
    var counts = Object.keys(weights);
    var n = parseInt(weightedPick(counts, counts.map(function (k) { return weights[k]; })), 10);
    var picked = [];
    var all = DATA.traits || [];

    function conflicts(t) {
      if (picked.indexOf(t.id) >= 0) return true;
      return picked.some(function (pid) {
        var p = TRAIT_BY_ID[pid];
        return (t.excludes || []).indexOf(pid) >= 0 || (p.excludes || []).indexOf(t.id) >= 0;
      });
    }

    while (picked.length < n) {
      // 已經沒有可抽的特質就停止(避免無窮迴圈)
      if (!all.some(function (t) { return !conflicts(t); })) break;
      var t = all[Math.floor(rng() * all.length)];
      if (conflicts(t)) continue;   // 重複或互斥 → 重抽
      picked.push(t.id);
    }
    return picked;
  }

  function newGame(opts) {
    opts = opts || {};
    var seed = (opts.seed != null) ? (Number(opts.seed) >>> 0) : (Date.now() >>> 0);
    rng = mulberry32(seed);

    S = {
      seed: seed,
      turn: 1,
      stats: {},
      tags: {},
      identity: null,
      traits: [],
      gameOver: false,
      ending: null,
      cause: null,
      card: null,
      lastChoice: null,   // 最後一次選擇 { cardId, side }
      lastSeen: {},   // 卡片 id → 上次出現(被選擇)的週數
      usedOnce: {},   // once 卡已用過
      evalGrade: null,     // 評鑑等第
      evalFail: false,
      evalScore: null,
      evalDetail: null,    // 評鑑算式明細 [{key, value}]
      tagFirst: {},        // 標籤 id → { up: 週數|null, down: 週數|null }
      speakerCount: {},    // 說話者 → 出現次數(年度成績單)
      lowWater: null       // 離上下限最近的一週 { stat, value, turn, dist }
    };

    DATA.stats.forEach(function (s) { S.stats[s.id] = s.initial; });
    (DATA.tags || []).forEach(function (t) { S.tags[t.id] = t.initial; S.tagFirst[t.id] = { up: null, down: null }; });

    // 身份：有指定用指定的，沒有就平均抽
    if (opts.identity) {
      if (!IDENTITY_BY_ID[opts.identity]) throw new Error('未知的身份 id：' + opts.identity);
      S.identity = opts.identity;
    } else {
      var ids = DATA.identities;
      S.identity = ids[Math.floor(rng() * ids.length)].id;
    }

    // 特質：有指定(非空陣列)用指定的，沒有就依規則抽
    if (opts.traits && opts.traits.length) {
      opts.traits.forEach(function (tid) {
        if (!TRAIT_BY_ID[tid]) throw new Error('未知的特質 id：' + tid);
      });
      S.traits = opts.traits.slice();
    } else {
      S.traits = drawTraits();
    }

    // 套用開局效果：身份 → 特質(依抽到順序)
    applyEffects(IDENTITY_BY_ID[S.identity].startEffects, 1);
    S.traits.forEach(function (tid) { applyEffects(TRAIT_BY_ID[tid].startEffects, 1); });

    // 開局數值夾在 startStatClamp(預設 20–80)
    var range = RULES.startStatClamp || [20, 80];
    Object.keys(S.stats).forEach(function (k) {
      S.stats[k] = clamp(S.stats[k], range[0], range[1]);
    });

    S.card = drawCard();
    return getState();
  }

  // ---------- 一回合(規格書 4-5，順序嚴格固定) ----------
  function choose(side) {
    if (!S || S.gameOver || !S.card) return S ? getState() : null;
    if (side !== 'left' && side !== 'right') throw new Error("choose() 只接受 'left' 或 'right'");

    var card = S.card;
    var opt = card[side] || {};

    // 0. 機率結果：用同一個種子亂數抽一次，決定是哪一種結果
    var outcome = null;
    var effects = opt.effects;
    if (opt.chance && opt.chance.length) {
      var r = rng(), acc = 0;
      outcome = opt.chance.length - 1;
      for (var i = 0; i < opt.chance.length; i++) {
        acc += opt.chance[i].p;
        if (r < acc) { outcome = i; break; }
      }
      effects = opt.chance[outcome].effects;
    }
    S.lastChoice = { cardId: card.id, side: side, outcome: outcome };
    S.lastSeen[card.id] = S.turn;
    if (card.once) S.usedOnce[card.id] = true;
    var sp = card.speaker || '';
    S.speakerCount[sp] = (S.speakerCount[sp] || 0) + 1;

    // 1. 卡片效果(爬升週起數值乘倍率後四捨五入遠離零)
    applyEffects(effects, rampMultiplier(S.turn), true);

    // 2. 身份與特質的 perTurnEffects(週數 ÷ perTurnEvery 整除才套用，不乘倍率)
    var owners = [IDENTITY_BY_ID[S.identity]].concat(S.traits.map(function (t) { return TRAIT_BY_ID[t]; }));
    owners.forEach(function (o) {
      if (!o || !o.perTurnEffects) return;
      var every = o.perTurnEvery || 1;
      if (S.turn % every === 0) applyEffects(o.perTurnEffects, 1, false);
    });

    // 3. Game Over 判斷(數值不先夾住)
    var cause = findCause();
    if (cause) return finish(cause);

    // 4. 評鑑週：判定等第並套用效果；fail 等第 = base 數值歸零
    if (YEAR && S.turn === YEAR.evalWeek && RULES['eval']) {
      evaluate();
      if (S.evalFail) {
        var base = RULES['eval'].base;
        S.stats[base] = STAT_BY_ID[base].min;
        return finish({ stat: base, bound: 'min' });
      }
      cause = findCause();
      if (cause) return finish(cause);
    }

    // 5. 離上下限最近的那一週
    updateLowWater();

    // 6. 學年結束
    if (YEAR && S.turn >= YEAR.weeks) return finish({ bound: 'yearEnd' });

    // 7. 沒結束才週數 +1，抽下一張
    S.turn += 1;
    S.card = drawCard();
    return getState();
  }

  function finish(cause) {
    S.gameOver = true;
    S.cause = cause;
    S.ending = pickEnding(cause);
    S.card = null;
    saveUnlocked(S.ending);
    return getState();
  }

  // 評鑑(rules.eval)：分數 = base 數值 + Σ 權重 × 標籤(posOnly 的標籤只算正值)
  function evaluate() {
    var E = RULES['eval'];
    var score = S.stats[E.base];
    var detail = [{ key: E.base, value: S.stats[E.base] }];
    Object.keys(E.weights).forEach(function (k) {
      var v = S.tags[k];
      if ((E.posOnly || []).indexOf(k) >= 0) v = Math.max(0, v);
      var pts = E.weights[k] * v;
      score += pts;
      if (pts !== 0) detail.push({ key: k, value: pts });
    });
    S.evalScore = score;
    var g = null;
    for (var i = 0; i < E.grades.length; i++) { if (score >= E.grades[i].min) { g = E.grades[i]; break; } }
    S.evalGrade = g.grade;
    S.evalDetail = detail;
    S.evalFail = !!g.fail;
    var eff = g.effects || {};
    Object.keys(eff.stats || {}).forEach(function (k) {
      var v = eff.stats[k];
      S.stats[k] = v > 0 ? Math.min(g.cap != null ? g.cap : Infinity, S.stats[k] + v) : S.stats[k] + v;
    });
    Object.keys(eff.tags || {}).forEach(function (k) {
      var def = TAG_BY_ID[k];
      S.tags[k] = clamp(S.tags[k] + eff.tags[k], def.min, def.max);
    });
  }

  function gradeInfo(name) {
    var gs = (RULES['eval'] && RULES['eval'].grades) || [];
    for (var i = 0; i < gs.length; i++) if (gs[i].grade === name) return gs[i];
    return null;
  }

  function updateLowWater() {
    DATA.stats.forEach(function (def) {
      var v = S.stats[def.id];
      var dist = Math.min(v - def.min, def.max - v);
      if (!S.lowWater || dist < S.lowWater.dist) S.lowWater = { stat: def.id, value: v, turn: S.turn, dist: dist };
    });
  }

  // 任務是否達成(用目前狀態判斷；等第標 blocksMission 時不算)
  function missionDone() {
    var idt = IDENTITY_BY_ID[S.identity];
    if (!idt || !idt.mission) return null;
    var g = gradeInfo(S.evalGrade);
    return checkAll(idt.mission.conditions, makeCtx(null)) && !(g && g.blocksMission);
  }

  // ---------- 查詢 ----------
  function getState() {
    if (!S) return null;
    return {
      turn: S.turn,
      stats: copy(S.stats),
      tags: copy(S.tags),
      identity: S.identity,
      traits: S.traits.slice(),
      gameOver: S.gameOver,
      ending: S.ending,
      // 以下為額外資訊
      lastChoice: copy(S.lastChoice),
      cause: copy(S.cause),
      cardId: S.card ? S.card.id : null,
      seed: S.seed,
      // 學年制(VS v1)
      phase: currentPhase(),
      weeks: YEAR ? YEAR.weeks : null,
      evalWeek: YEAR ? YEAR.evalWeek : null,
      evalGrade: S.evalGrade,
      evalScore: S.evalScore,
      evalDetail: copy(S.evalDetail),
      speakerCount: copy(S.speakerCount),
      lowWater: copy(S.lowWater),
      tagFirst: copy(S.tagFirst),
      missionDone: missionDone()
    };
  }

  function currentCard() {
    return S && S.card ? copy(S.card) : null;
  }

  // ---------- 除錯／測試用 ----------
  function jumpToTurn(n) {
    if (!S) return null;
    n = Math.floor(Number(n));
    if (!(n >= 1)) throw new Error('jumpToTurn(n)：n 必須是 ≥ 1 的整數');
    S.turn = n;
    return getState();
  }

  // 只覆寫有給的欄位；stats/tags 可只給部分 key。不做 Game Over 判斷、不夾住
  function setState(p) {
    if (!S || !p) return getState();
    if (p.stats) Object.keys(p.stats).forEach(function (k) { if (k in S.stats) S.stats[k] = p.stats[k]; });
    if (p.tags) Object.keys(p.tags).forEach(function (k) { if (k in S.tags) S.tags[k] = p.tags[k]; });
    if (p.turn != null) S.turn = p.turn;
    if (p.evalGrade !== undefined) S.evalGrade = p.evalGrade;
    return getState();
  }

  // 把目前卡片換成指定卡(不檢查條件)
  function forceCard(cardId) {
    if (!S) return null;
    var card = CARD_BY_ID[cardId];
    if (!card) throw new Error('未知的卡片 id：' + cardId);
    S.card = card;
    return copy(card);
  }

  window.GameEngine = {
    newGame: newGame,
    getState: getState,
    currentCard: currentCard,
    choose: choose,
    jumpToTurn: jumpToTurn,
    setState: setState,
    forceCard: forceCard,
    // 給畫面用的輔助
    data: DATA,
    getEnding: function (id) { return ENDING_BY_ID[id] || null; },
    getUnlocked: readUnlocked,
    roundAway: roundAway,
    phaseOf: phaseOf,
    CONDITIONS: CONDITIONS
  };
})();

    return 'l';
  }
  // 機率選項：每個數值取各種結果裡絕對值最大的(只看大小、不看方向，不洩漏機率)
  function previewMagnitudes(opt) {
    var out = {};
    var list = opt ? (opt.chance ? opt.chance.map(function (o) { return o.effects; }) : [opt.effects]) : [];
    list.forEach(function (e) {
      var st = (e && e.stats) || {};
      Object.keys(st).forEach(function (k) { if (Math.abs(st[k]) > Math.abs(out[k] || 0)) out[k] = st[k]; });
    });
    return out;
  }
  var PREVIEW_DOTS = !!(DATA.rules && DATA.rules.previewDots);   // 預設 false：只移動 ▶ 游標；true：恢復圓點預覽

  // 拖曳／滑鼠移到選項上：移動 ▶ 游標；rules.previewDots 為 true 時另外預覽會動的數值(大小)
  var hintSide = null;
  function showHint(side) {
    if (side === hintSide) return;
    hintSide = side;
    if (PREVIEW_DOTS) {
      var card = E.currentCard();
      var eff = side && card ? previewMagnitudes(card[side]) : {};
      DATA.stats.forEach(function (s) {
        var slot = statNodes[s.id].dot;
        slot.innerHTML = '';
        var size = side ? dotSize(eff[s.id]) : null;
        if (size) slot.appendChild(el('span', 'dot ' + size));
      });
    }
    if (side) setSel(side);
    $('btn-left').classList.toggle('hint', side === 'left');
    $('btn-right').classList.toggle('hint', side === 'right');
  }

  // ▶ 游標停在哪一個選項
  var selSide = 'left';
  function setSel(side) {
    selSide = side;
    $('btn-left').classList.toggle('sel', side === 'left');
    $('btn-right').classList.toggle('sel', side === 'right');
  }

  // ---------- 打字機效果 ----------
  var typing = false;
  var typeTimer = null;

  function startTyping(text) {
    clearInterval(typeTimer);
    var chars = Array.from(text || '');
    var box = $('card-text');
    box.innerHTML = '';
    var typed = el('span', 'typed');
    var rest = el('span', 'untyped');   // 還沒打出來的字先佔位(隱形)，版面不會跳動
    box.appendChild(typed);
    box.appendChild(rest);
    if (REDUCED || chars.length === 0) {
      typed.textContent = text || '';
      typingDone();
      return;
    }
    typing = true;
    $('screen-game').classList.add('typing');
    var i = 0;
    rest.textContent = text;
    typeTimer = setInterval(function () {
      i++;
      typed.textContent = chars.slice(0, i).join('');
      rest.textContent = chars.slice(i).join('');
      if (i >= chars.length) finishTyping();
    }, TYPE_MS);
  }

  // 點一下直接顯示全文
  function finishTyping() {
    if (!typing) return;
    clearInterval(typeTimer);
    var card = E.currentCard();
    var box = $('card-text');
    var typed = box.querySelector('.typed'), rest = box.querySelector('.untyped');
    if (typed && rest) { typed.textContent = card ? card.text : typed.textContent + rest.textContent; rest.textContent = ''; }
    typingDone();
  }

  function typingDone() {
    typing = false;
    $('screen-game').classList.remove('typing');
  }

  // ---------- 遊戲畫面 ----------
  function renderGame() {
    var st = E.getState();
    var card = E.currentCard();
    phase = 'card';
    renderStats();
    clearChangeMarks();
    showHint(null);
    setSel('left');
    $('card-result').hidden = true;
    $('reply').hidden = false;
    $('screen-game').classList.remove('showing-result');
    $('tap-hint').hidden = false;
    $('btn-next').hidden = true;
    var needOverlay = phaseOverlayNeeded(st);
    if (card) {
      var av = $('card-avatar');
      av.innerHTML = '';
      av.appendChild(pix(card.avatar, 64));
      $('card-speaker').textContent = card.speaker || '';
      ['left', 'right'].forEach(function (side) {
        var b = $('btn-' + side);
        b.textContent = card[side].label;
        // 機率選項：後面加一顆小骰子(結果要選了才知道)
        if (card[side].chance) b.appendChild(pix('🎲', 22, 'dice'));
        b.classList.toggle('chance', !!card[side].chance);
      });
      if (needOverlay) {
        $('card-text').textContent = '';
      } else {
        startTyping(card.text || '');
      }
    }
    var idt = byId(DATA.identities, st.identity);
    $('turn-label').textContent = turnText(st.turn);
    $('week-left').textContent = weekLeftText(st);
    $('week-identity').textContent = idt ? idt.name : '';
    renderEvalBar(st);
    resetCardPosition(false);
    updateDebugPanel();
    if (needOverlay) showPhaseOverlay(st.phase);
  }

  // 「距離 X 週」：含本週(第 21 週距離第 29 週的評鑑 = 9 週)
  function weeksUntil(target, turn) { return target - turn + 1; }
  function weekLeftText(st) {
    if (!YEAR) return '';
    var n = weeksUntil(YEAR.weeks, st.turn);
    return n <= 1 ? '｜最後一週' : '｜距離學年結束 ' + n + ' ' + UNIT;
  }
  // 第三階段：評鑑倒數警示條
  function renderEvalBar(st) {
    var bar = $('eval-bar');
    if (!YEAR || !EVAL || st.phase !== 3 || st.turn > YEAR.evalWeek) { bar.hidden = true; return; }
    var n = weeksUntil(YEAR.evalWeek, st.turn);
    bar.textContent = n <= 1 ? '！本週評鑑！' : '！距離評鑑 ' + n + ' ' + UNIT + '！';
    bar.hidden = false;
  }

  // ---------- 過場標題 ----------
  var phaseSeen = 0;   // 這一局已經顯示過第幾階段的過場
  function phaseOverlayNeeded(st) {
    if (!YEAR || !YEAR.phases) return false;
    return st.phase > phaseSeen && YEAR.phaseStarts.indexOf(st.turn) >= 0;
  }
  function showPhaseOverlay(p) {
    phaseSeen = p;
    clearChangeMarks();
    var info = YEAR.phases[p - 1] || {};
    $('phase-title').textContent = info.title || '';
    $('phase-sub').textContent = info.sub || '';
    phase = 'overlay';
    overlayShownAt = Date.now();
    $('phase-overlay').classList.add('active');
  }
  function closePhaseOverlay() {
    $('phase-overlay').classList.remove('active');
    phase = 'card';
    var card = E.currentCard();
    if (card) startTyping(card.text || '');
  }

  // ---------- 評鑑結果 ----------
  var evalShown = false;
  var overlayShownAt = 0;
  function gradeOf(name) {
    return ((EVAL && EVAL.grades) || []).filter(function (x) { return x.grade === name; })[0] || null;
  }
  // 算式項目名稱：labels 可以依正負分開寫(key+ / key-)，沒有就用 key
  function evalLabel(key, value) {
    var L = (EVAL && EVAL.labels) || {};
    return L[key + (value >= 0 ? '+' : '-')] || L[key] || key;
  }
  function showEvalOverlay(st) {
    evalShown = true;
    clearChangeMarks();
    var box = $('eval-lines');
    box.innerHTML = '';
    (st.evalDetail || []).forEach(function (d, i) {
      var row = el('div', 'eval-line' + (d.value < 0 ? ' neg' : ''));
      row.appendChild(el('span', null, evalLabel(d.key, d.value)));
      row.appendChild(el('span', 'n', (i > 0 && d.value > 0 ? '+' : '') + d.value));
      box.appendChild(row);
    });
    var total = el('div', 'eval-line eval-total');
    total.appendChild(el('span', null, '評鑑分數'));
    total.appendChild(el('span', 'n', String(st.evalScore)));
    box.appendChild(total);
    var g = $('eval-grade');
    g.textContent = st.evalGrade || '';
    var gd = gradeOf(st.evalGrade);
    g.classList.toggle('bad', !!(gd && gd.bad));
    $('eval-line').textContent = gd ? (gd.line || '') : '';
    phase = 'eval';
    overlayShownAt = Date.now();
    $('eval-overlay').classList.add('active');
  }
  function closeEvalOverlay() {
    $('eval-overlay').classList.remove('active');
    phase = 'card';
    advance();
  }

  // ---------- 拖曳與選擇 ----------
  var cardEl = $('card');
  var busy = false;
  var drag = null;

  function setCardTransform(dx, withAnim) {
    cardEl.style.transition = withAnim ? ('transform ' + ANIM_MS + 'ms steps(4)') : 'none';
    cardEl.style.transform = dx ? ('translateX(' + dx + 'px)') : '';
  }

  function resetCardPosition(withAnim) {
    setCardTransform(0, withAnim);
  }

  function dragThreshold() {
    return Math.min(110, cardEl.offsetWidth * 0.28);
  }

  // 畫面狀態：'card' = 等玩家選擇；'result' = 顯示後果句，等玩家點一下
  // (引擎的 choose() 已經立即套用效果，這裡只是畫面在等)
  var phase = 'card';
  var resultShownAt = 0;

  // 選擇某一邊：有後果句 → 對話框歸位、下方出現黃框；沒有後果句 → 對話框飛出直接換下一張
  function commit(side) {
    if (busy || phase !== 'card') return;
    if (typing) { finishTyping(); return; }   // 全文顯示後才能選擇
    busy = true;
    showHint(side);
    var card = E.currentCard();
    var before = E.getState().stats;
    var opt = card && card[side];
    var result = opt && (opt.result || (opt.chance ? true : null));
    if (result) {
      resetCardPosition(true);
    } else {
      var dir = side === 'left' ? -1 : 1;
      setCardTransform(dir * (window.innerWidth + cardEl.offsetWidth), true);
    }
    setTimeout(function () {
      E.choose(side);
      busy = false;
      if (result) {
        showResult(card, side, result, before);
      } else {
        advance();   // 沒有後果句(舊資料)：直接下一張
      }
    }, ANIM_MS);
  }

  // 顯示後果句(黃框)，同時更新數值條並標示變動方向
  function showResult(card, side, result, before) {
    var st = E.getState();
    phase = 'result';
    resultShownAt = Date.now();
    showHint(null);
    renderStats();
    markChanges(before, st.stats);
    maybeShake(before, st.stats);
    $('result-choice').textContent = '你選了：' + card[side].label;
    var rt = $('result-text');
    rt.textContent = '';
    var oc = st.lastChoice && st.lastChoice.outcome;
    if (card[side].chance && oc != null) {
      var o = card[side].chance[oc];
      // 機率結果：只標運氣好／不好，不顯示百分比(避免玩家算機率)
      rt.appendChild(el('span', 'res-tag t11', o.luck === 'good' ? '🎲 運氣好' : '🎲 運氣不好'));
      rt.appendChild(document.createTextNode(o.result));
    } else {
      rt.textContent = result;
    }
    $('card-result').hidden = false;
    $('reply').hidden = true;   // 後果句期間不能重新選擇
    $('screen-game').classList.add('showing-result');
    $('tap-hint').hidden = true;
    $('btn-next').hidden = false;
    $('btn-next').textContent = st.gameOver ? '— 點一下，看結局 —' : '— 點一下繼續 —';
    resetCardPosition(false);
    updateDebugPanel();
  }

  // 單一數值一次掉 ≥ 13 → 畫面震動 0.3 秒(動態減少時不震)
  var shakeTimer = null;
  function maybeShake(before, after) {
    if (REDUCED) return;
    var hit = DATA.stats.some(function (s) { return before[s.id] - after[s.id] >= SHAKE_DROP; });
    if (!hit) return;
    app.classList.remove('shake');
    void app.offsetWidth;
    app.classList.add('shake');
    clearTimeout(shakeTimer);
    shakeTimer = setTimeout(function () { app.classList.remove('shake'); }, SHAKE_MS);
  }

  // 進下一張；評鑑週剛結束 → 先看評鑑結果；已經 Game Over → 結局畫面
  function advance() {
    phase = 'card';
    var st0 = E.getState();
    if (st0.evalGrade && !evalShown) { showEvalOverlay(st0); return; }
    if (st0.gameOver) {
      clearChangeMarks();
      renderEnd();
      show('end');
      startCountdown();
    } else {
      renderGame();
    }
  }

  function markChanges(before, after) {
    DATA.stats.forEach(function (s) {
      var node = statNodes[s.id];
      var diff = after[s.id] - before[s.id];
      node.box.classList.remove('changed');
      void node.box.offsetWidth;   // 重新觸發閃爍動畫
      node.box.classList.toggle('changed', diff !== 0);
      node.mark.innerHTML = '';
      if (diff !== 0) node.mark.appendChild(el('span', 'stat-arrow', diff > 0 ? '↑' : '↓'));
    });
  }

  function clearChangeMarks() {
    DATA.stats.forEach(function (s) {
      statNodes[s.id].box.classList.remove('changed');
      statNodes[s.id].mark.innerHTML = '';
      statNodes[s.id].dot.innerHTML = '';
    });
  }

  // 點遊戲畫面任一處：打字中 → 顯示全文；後果句 → 下一張
  $('screen-game').addEventListener('click', function () {
    if (phase === 'overlay' || phase === 'eval') {
      if (Date.now() - overlayShownAt < 250) return;   // 避免同一下點擊直接跳過
      if (phase === 'overlay') closePhaseOverlay(); else closeEvalOverlay();
      return;
    }
    if (phase === 'card' && typing) { finishTyping(); return; }
    if (phase !== 'result') return;
    if (Date.now() - resultShownAt < 120) return;   // 避免選擇時的同一下點擊直接跳過
    advance();
  });

  cardEl.addEventListener('pointerdown', function (e) {
    if (busy || drag || phase !== 'card') return;   // 後果句顯示期間不能拖曳
    if (typing) return;                             // 打字中：放開時的點擊會顯示全文
    drag = { id: e.pointerId, x0: e.clientX, dx: 0 };
    try { cardEl.setPointerCapture(e.pointerId); } catch (err) { /* 舊瀏覽器 */ }
    setCardTransform(0, false);
  });

  cardEl.addEventListener('pointermove', function (e) {
    if (!drag || e.pointerId !== drag.id) return;
    drag.dx = e.clientX - drag.x0;
    setCardTransform(drag.dx, false);
    if (Math.abs(drag.dx) < DRAG_HINT_PX) showHint(null);
    else showHint(drag.dx < 0 ? 'left' : 'right');   // 往左 = left(上)、往右 = right(下)
  });

  function endDrag(e, cancelled) {
    if (!drag || e.pointerId !== drag.id) return;
    var dx = drag.dx;
    drag = null;
    if (!cancelled && Math.abs(dx) >= dragThreshold()) {
      commit(dx < 0 ? 'left' : 'right');
    } else {
      showHint(null);
      resetCardPosition(true);   // 沒超過門檻 → 回到原位
    }
  }
  cardEl.addEventListener('pointerup', function (e) { endDrag(e, false); });
  cardEl.addEventListener('pointercancel', function (e) { endDrag(e, true); });

  // 點選項直接選(打字中先顯示全文)
  $('btn-left').addEventListener('click', function () { commit('left'); });
  $('btn-right').addEventListener('click', function () { commit('right'); });

  // 桌機滑鼠移到選項上：游標跟著移動並顯示預覽方塊
  ['left', 'right'].forEach(function (side) {
    var b = $('btn-' + side);
    b.addEventListener('pointerenter', function (e) { if (e.pointerType === 'mouse' && !busy && !drag && phase === 'card' && !typing) showHint(side); });
    b.addEventListener('pointerleave', function (e) { if (e.pointerType === 'mouse' && !busy && !drag && phase === 'card') showHint(null); });
  });

  // 鍵盤：↑↓ 移動游標、Enter／空白鍵確定(在遊戲畫面)
  document.addEventListener('keydown', function (e) {
    if (currentScreen !== 'game') return;
    var onButton = document.activeElement && document.activeElement.tagName === 'BUTTON';
    if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
      if (phase === 'card' && !typing) { setSel(e.key === 'ArrowUp' ? 'left' : 'right'); e.preventDefault(); }
    } else if ((e.key === 'Enter' || e.key === ' ') && !onButton) {
      e.preventDefault();
      if (phase === 'overlay') closePhaseOverlay();
      else if (phase === 'eval') closeEvalOverlay();
      else if (phase === 'result') advance();
      else if (typing) finishTyping();
      else commit(selSide);
    }
  });

  // ---------- GAME OVER ----------
  // 除錯用：?debug=1&ending={id} 直接看某個結局(不經過引擎，只是畫面預覽)
  var endOverride = null;

  function debugEndingPreview(endingId) {
    var ending = E.getEnding(endingId);
    if (!ending) return null;
    var c = (ending.conditions || []).filter(function (x) { return x.type === 'cause'; })[0];
    // 最後一張卡：資料中文字最長的那張，和它較長的後果句
    var longest = DATA.cards.reduce(function (a, b) {
      return Array.from(b.text || '').length > Array.from(a.text || '').length ? b : a;
    });
    var lr = Array.from(longest.left.result || '').length, rr = Array.from(longest.right.result || '').length;
    var year = c && c.bound === 'yearEnd';
    var failEval = (ending.conditions || []).some(function (x) { return x.type === 'evalGrade'; });
    var idc = (ending.conditions || []).filter(function (x) { return x.type === 'identity'; })[0];
    // 年度成績單預覽用的假資料(全部從資料取，不寫死內容)
    var grades = (EVAL && EVAL.grades) || [];
    var failG = grades.filter(function (x) { return x.fail; })[0];
    var okG = grades.filter(function (x) { return !x.bad && !x.fail; }).slice(-1)[0];
    var speakers = {}, sp = [];
    DATA.cards.forEach(function (cd) { if (cd.speaker && sp.indexOf(cd.speaker) < 0 && sp.length < 2) sp.push(cd.speaker); });
    if (sp[0]) speakers[sp[0]] = 7;
    if (sp[1]) speakers[sp[1]] = 5;
    var fakeTags = {};
    (DATA.tags || []).forEach(function (t, i) { fakeTags[t.id] = [-6, 2, 0, 3, 1, 4][i % 6]; });
    var lwStat = DATA.stats[Math.min(2, DATA.stats.length - 1)];
    var pv = {
      ending: endingId,
      cause: year ? { bound: 'yearEnd' } : (c ? { stat: c.stat, bound: c.bound } : null),
      turn: year ? (YEAR ? YEAR.weeks : 36) : (failEval && YEAR ? YEAR.evalWeek : 23),
      gameOver: true,
      lastChoice: { cardId: longest.id, side: rr > lr ? 'right' : 'left', outcome: null },
      evalGrade: failEval ? (failG ? failG.grade : null) : (year && okG ? okG.grade : null),
      speakerCount: speakers,
      lowWater: { stat: lwStat.id, value: lwStat.min + 6, turn: 17, dist: 6 },
      tags: fakeTags
    };
    if (idc) pv.identity = idc.any[0];
    return pv;
  }

  function endingInfo() {
    var st = E.getState();
    if (endOverride) {
      Object.keys(endOverride).forEach(function (k) { st[k] = endOverride[k]; });
    }
    var ending = E.getEnding(st.ending) || {};
    var yearEnd = !!(st.cause && st.cause.bound === 'yearEnd');
    var statDef = (st.cause && !yearEnd) ? byId(DATA.stats, st.cause.stat) : null;
    var idt = byId(DATA.identities, st.identity);
    var causeText = statDef ? (statShort(statDef) + boundWord(st.cause.bound)) : '';
    var gi = gradeOf(st.evalGrade);
    if (gi && gi.fail && EVAL && st.cause && st.cause.stat === EVAL.base && st.cause.bound === 'min') causeText = '評鑑' + gi.grade;
    if (yearEnd) causeText = '撐完一學年';
    return {
      state: st,
      ending: ending,
      yearEnd: yearEnd,
      causeText: causeText,
      identityName: idt ? idt.name : '',
      unlocked: E.getUnlocked().length,
      total: DATA.endings.length
    };
  }

  function renderEnd() {
    var info = endingInfo();
    var st = info.state;
    var title = info.ending.title || '';
    paintStats(endStatNodes, st.stats);
    $('end-go').textContent = info.yearEnd ? '學年結束' : 'GAME OVER';
    $('end-go').classList.toggle('clear', info.yearEnd);
    $('end-title').textContent = title;
    $('end-cause').textContent = info.causeText;
    $('end-text').textContent = info.ending.text || '';
    $('end-turns').textContent = '撐了 ' + st.turn + ' ' + UNIT;
    $('end-unlocked').textContent = '已解鎖 ' + info.unlocked + ' / ' + info.total;

    // 壓垮你的最後一張卡：來自 getState().lastChoice
    var lc = st.lastChoice;
    var lastCard = lc ? byId(DATA.cards, lc.cardId) : null;
    var opt = lastCard ? lastCard[lc.side] : null;
    $('last-card').hidden = !opt;
    if (opt) {
      $('last-card-label').textContent = (info.yearEnd ? '最後一張卡｜' : '壓垮你的最後一張卡｜') + turnText(st.turn);
      $('last-card-speaker').textContent = lastCard.speaker || '';
      $('last-card-text').textContent = lastCard.text || '';
      $('last-card-choice').textContent = '你選了「' + opt.label + '」';
      var lres = opt.result || '';
      if (opt.chance && lc.outcome != null && opt.chance[lc.outcome]) lres = opt.chance[lc.outcome].result;
      $('last-card-result').textContent = lres;
      $('last-card-result').hidden = !lres;
    }
    renderReport(info);
    document.querySelector('#screen-end .end-top').scrollTop = 0;

    // 「給回饋」：只有 meta.feedbackUrl 有值才顯示
    var fb = $('btn-feedback');
    if (META.feedbackUrl) {
      fb.href = buildFeedbackUrl(META.feedbackUrl, {
        identity: info.identityName,
        ending: title,
        weeks: String(st.turn)
      });
      fb.hidden = false;
    } else {
      fb.hidden = true;
      fb.removeAttribute('href');
    }
  }

  // ---------- 年度成績單(結局畫面與分享圖共用) ----------
  var SUMMARY = DATA.summary || {};
  function statName(id) { var d = byId(DATA.stats, id); return d ? statShort(d) : id; }
  function tagName(id) { var d = byId(DATA.tags, id); return d ? d.name : id; }

  // 回傳 { rows: [[項目, 內容], …], comment }
  function reportData(info) {
    var st = info.state;
    var L = SUMMARY.labels || [];
    var rows = [];
    var W = YEAR ? YEAR.weeks : null;
    // 1. 任期
    rows.push([L[0], info.yearEnd ? ('撐完 ' + st.turn + ' ' + UNIT) : (W ? ('第 ' + st.turn + ' ' + UNIT + '倒下(' + st.turn + ' / ' + W + ')') : turnText(st.turn))]);
    // 2. 評鑑等第
    rows.push([L[1], st.evalGrade || '沒等到評鑑']);
    // 3. 任務：達成 ✔／未達成(目前值 / 門檻)
    var idt = byId(DATA.identities, st.identity);
    if (idt && idt.mission) {
      var c = (idt.mission.conditions || [])[0];
      var cur = '';
      if (c && c.type === 'stat') cur = statName(c.stat) + ' ' + st.stats[c.stat] + ' / ' + c.value;
      if (c && c.type === 'tag') cur = tagName(c.tag) + ' ' + st.tags[c.tag] + ' / ' + c.value;
      var done = info.yearEnd ? /^y_mission_/.test(st.ending || '') : false;
      rows.push([L[2], done ? '達成 ✔' : (info.yearEnd ? '未達成(' + cur + ')' : '沒機會驗收(' + cur + ')')]);
    }
    // 4. 出現最多次的說話者
    var sc = st.speakerCount || {}, who = null;
    Object.keys(sc).forEach(function (k) { if (who === null || sc[k] > sc[who]) who = k; });
    if (who !== null) rows.push([L[3], who + ' ×' + sc[who]]);
    // 5. 離上下限最近的那一週
    var lw = st.lowWater;
    if (lw) {
      var def = byId(DATA.stats, lw.stat);
      var low = def && (lw.value - def.min) <= (def.max - lw.value);
      rows.push([L[4], turnText(lw.turn) + '，' + statName(lw.stat) + (low ? '剩 ' : '衝到 ') + lw.value]);
    }
    // 年度評價：絕對值最大的標籤(同分取資料順序在前的)，依正負取句；全部 0 用通用句
    var best = null;
    (DATA.tags || []).forEach(function (t) {
      var v = st.tags[t.id] || 0;
      if (v !== 0 && (best === null || Math.abs(v) > Math.abs(st.tags[best]))) best = t.id;
    });
    var comments = SUMMARY.comments || {};
    var comment = best === null ? (SUMMARY.commentZero || '') : (comments[best + (st.tags[best] > 0 ? '+' : '-')] || '');
    return { rows: rows, comment: comment };
  }

  function renderReport(info) {
    var box = $('report');
    if (!YEAR) { box.hidden = true; return; }
    box.hidden = false;
    var r = reportData(info);
    var rows = $('report-rows');
    rows.innerHTML = '';
    r.rows.forEach(function (x) {
      var row = el('div', 'report-row');
      row.appendChild(el('span', 'k t11', x[0]));
      row.appendChild(el('span', 'v t22', x[1]));
      rows.appendChild(row);
    });
    $('report-comment').textContent = r.comment ? '「' + r.comment + '」' : '';
  }

  // CONTINUE? 10 → 0 每秒倒數；到 0 只停在畫面上，不自動跳轉
  var countTimer = null;
  var countValue = CONTINUE_FROM;
  function startCountdown() {
    stopCountdown();
    countValue = CONTINUE_FROM;
    $('continue-count').textContent = countValue;
    countTimer = setInterval(function () {
      countValue = Math.max(0, countValue - 1);
      $('continue-count').textContent = countValue;
      if (countValue === 0) stopCountdown();
    }, 1000);
  }
  function stopCountdown() {
    clearInterval(countTimer);
    countTimer = null;
  }

  // 把範本中的 {identity}／{ending}／{weeks} 換成實際值(先 encodeURIComponent)
  // Google 表單預先填入連結會把 { } 編成 %7B %7D，所以兩種寫法都換，大小寫不拘
  function buildFeedbackUrl(template, values) {
    return String(template).replace(/(?:\{|%7B)(identity|ending|weeks)(?:\}|%7D)/gi, function (m, key) {
      return encodeURIComponent(values[key.toLowerCase()]);
    });
  }

  // 按下 CONTINUE = 再玩一次
  $('btn-again').addEventListener('click', function () { startNewGame(); });

  // ---------- 結局圖鑑 ----------
  var galleryReturnTo = 'start';

  function openGallery() {
    galleryReturnTo = currentScreen || 'start';
    renderGallery();
    show('gallery');
    $('gallery-list').scrollTop = 0;
  }

  // 觸發提示：取結局 conditions 裡 type=cause 的那一條 →「{icon} 歸零／爆表」
  function causeHint(ending) {
    var c = (ending.conditions || []).filter(function (x) { return x.type === 'cause'; })[0];
    if (!c) return '';
    if (c.bound === 'yearEnd') {
      var idc = (ending.conditions || []).filter(function (x) { return x.type === 'identity'; })[0];
      var who = idc ? byId(DATA.identities, idc.any[0]) : null;
      return '🎓 ' + (who ? who.name + '任務' : '撐完學年');
    }
    if ((ending.conditions || []).some(function (x) { return x.type === 'evalGrade'; })) return '📋 評鑑';
    var def = byId(DATA.stats, c.stat);
    var mark = def ? (def.icon || def.shortName || def.name) : c.stat;
    return mark + ' ' + boundWord(c.bound);
  }

  function renderGallery() {
    var unlocked = E.getUnlocked();   // localStorage 不可用時只含本次解鎖的
    $('gallery-count').textContent = '已解鎖 ' + unlocked.length + ' / ' + DATA.endings.length;
    var list = $('gallery-list');
    list.innerHTML = '';
    DATA.endings.forEach(function (e) {
      var open = unlocked.indexOf(e.id) >= 0;
      var item = el('div', 'gallery-item' + (open ? '' : ' locked'));
      item.appendChild(el('div', 'gallery-item-title t22', open ? (e.title || '') : '???'));
      if (!open) item.appendChild(el('div', 'gallery-item-hint', causeHint(e)));
      list.appendChild(item);
    });
  }

  $('btn-gallery-start').addEventListener('click', openGallery);
  $('btn-gallery-end').addEventListener('click', openGallery);
  $('btn-gallery-back').addEventListener('click', function () {
    if (galleryReturnTo === 'start') renderStartCount();
    show(galleryReturnTo);
  });
  function renderStartCount() {
    $('btn-gallery-start').textContent = '結局圖鑑 ' + E.getUnlocked().length + ' / ' + DATA.endings.length;
  }

  // ---------- 分享圖(canvas 1080×1350，像素風) ----------
  var PX = '"KBoss Pixel", monospace';
  var C = { k: '#0b0b14', w: '#f4f4f4', r: '#e43b44', y: '#feae34', g: '#63c74d', s: '#8b9bb4', d: '#262b44' };

  // 換行禁則：NO_START 不可在行首(拉回上一行，允許稍微超出寬度)；NO_END 不可在行尾(移到下一行)
  var NO_START = '，。、；：？！」』）)〉》…—～';
  var NO_END = '「『（(〈《';

  // 逐字量測換行(含禁則)
  function wrapLines(ctx, text, maxWidth) {
    var lines = [];
    var line = '';
    Array.from(String(text || '')).forEach(function (ch) {
      if (ch === '\n') { lines.push(line); line = ''; return; }
      var test = line + ch;
      if (line && ctx.measureText(test).width > maxWidth && NO_START.indexOf(ch) < 0) {
        // 要換行了：上一行結尾的「不可在行尾」字元一起帶到下一行
        var chars = Array.from(line), carry = '';
        while (chars.length && NO_END.indexOf(chars[chars.length - 1]) >= 0) carry = chars.pop() + carry;
        if (chars.length) {
          lines.push(chars.join(''));
          line = carry + ch;
        } else {
          line = test;   // 整行都是開括號這種極端情況：不拆
        }
      } else {
        line = test;     // 放得下，或是不可在行首的標點 → 留在這一行
      }
    });
    if (line) lines.push(line);
    return lines;
  }

  // 雙線白框(和畫面上的對話框同一種畫法)
  function pixelBox(ctx, x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = C.k;
    ctx.fillRect(x + 8, y + 8, w - 16, h - 16);
    ctx.fillStyle = color;
    ctx.fillRect(x + 14, y + 14, w - 28, h - 28);
    ctx.fillStyle = C.k;
    ctx.fillRect(x + 18, y + 18, w - 36, h - 36);
  }

  // 畫多行置中文字，字太多就縮小(字級維持 11 的倍數)，回傳下一行的 y
  function drawFit(ctx, text, cx, y, maxW, sizes, maxLines, color, shadow) {
    var size, lines;
    for (var i = 0; i < sizes.length; i++) {
      size = sizes[i];
      ctx.font = size + 'px ' + PX;
      lines = wrapLines(ctx, text, maxW);
      if (lines.length <= maxLines) break;
    }
    var lh = Math.round(size * 1.3);
    lines.forEach(function (l) {
      if (shadow) { ctx.fillStyle = shadow; ctx.fillText(l, cx + size / 11, y + size / 11, maxW + 40); }
      ctx.fillStyle = color;
      ctx.fillText(l, cx, y, maxW + 40);
      y += lh;
    });
    return y;
  }

  function makeShareCanvas() {
    var info = endingInfo();
    var W = 1080, H = 1350, M = 60;
    var canvas = document.createElement('canvas');
    canvas.width = W;
    canvas.height = H;
    var ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    ctx.textBaseline = 'top';
    ctx.textAlign = 'center';

    ctx.fillStyle = C.k; ctx.fillRect(0, 0, W, H);
    // 掃描線
    ctx.fillStyle = 'rgba(255, 255, 255, 0.04)';
    for (var sy = 0; sy < H; sy += 6) ctx.fillRect(0, sy, W, 2);

    var y = 70;
    y = drawFit(ctx, META.title || '', W / 2, y, W - 2 * M, [99, 88, 77, 66], 1, C.y, C.r);
    y += 30;
    y = drawFit(ctx, info.yearEnd ? '學年結束' : 'GAME OVER', W / 2, y, W - 2 * M, [88], 1, info.yearEnd ? C.g : C.r);
    y += 20;
    y = drawFit(ctx, info.ending.title || '', W / 2, y, W - 2 * M, [66, 55, 44], 2, C.y);
    y += 30;

    // 對話框：shareText(白字，換行禁則)
    var boxTop = y;
    ctx.font = '55px ' + PX;
    var size = 55, lines = wrapLines(ctx, info.ending.shareText || '', W - 2 * M - 100);
    if (lines.length > 3) { size = 44; ctx.font = size + 'px ' + PX; lines = wrapLines(ctx, info.ending.shareText || '', W - 2 * M - 100); }
    var lh = Math.round(size * 1.4);
    var boxH = 100 + lines.length * lh;
    pixelBox(ctx, M, boxTop, W - 2 * M, boxH, C.w);
    var ty = boxTop + 50;
    ctx.textAlign = 'left';
    lines.forEach(function (l) {
      ctx.fillStyle = C.w;
      ctx.fillText(l, M + 50, ty, W - 2 * M - 70);
      ty += lh;
    });
    y = Math.max(boxTop + boxH + 40, YEAR ? 640 : 760);

    // 最後的狀態列：像素圖示 + 名稱 + 10 格數值條(和遊戲畫面同一套規則)
    var colW = (W - 2 * M) / DATA.stats.length;
    DATA.stats.forEach(function (s, i) {
      var cx = M + colW * (i + 0.5);
      if (s.icon) ctx.drawImage(pix(s.icon, 64), cx - 32, y, 64, 64);
      ctx.textAlign = 'center'; ctx.fillStyle = C.s; ctx.font = '33px ' + PX;
      ctx.fillText(s.shortName || s.name, cx, y + 76, colW - 10);
      var lit = litCells(info.state.stats[s.id], s);
      var on = lit <= 2 ? C.r : lit >= 9 ? C.y : C.g;
      for (var k = 0; k < 10; k++) {
        ctx.fillStyle = k < lit ? on : C.d;
        ctx.fillRect(cx - 99 + k * 20, y + 124, 16, 22);
      }
    });
    y += YEAR ? 180 : 200;

    // 身份｜撐了 N 週、已解鎖數
    ctx.textAlign = 'center';
    y = drawFit(ctx, '身份：' + info.identityName + '｜撐了 ' + info.state.turn + ' ' + UNIT, W / 2, y, W - 2 * M, [44, 33], 1, C.g);
    if (YEAR) {
      // 學年制：評鑑等第｜任務、年度評價(最多 2 行)
      var rd = reportData(info);
      var ev = rd.rows[1] ? rd.rows[1][1] : '';
      var ms = rd.rows[2] ? (/^達成/.test(rd.rows[2][1]) ? '任務達成 ✔' : '任務未達成') : '';
      y += 6;
      y = drawFit(ctx, '評鑑：' + ev + (ms ? '｜' + ms : ''), W / 2, y, W - 2 * M, [44, 33], 1, C.w);
      if (rd.comment) {
        y += 6;
        y = drawFit(ctx, '「' + rd.comment + '」', W / 2, y, W - 2 * M, [44, 33], 2, C.y);
      }
    }
    y += 10;
    drawFit(ctx, '已解鎖 ' + info.unlocked + ' / ' + info.total, W / 2, y, W - 2 * M, [44, 33], 1, C.s);

    // shareUrl 有值才印在底部
    if (META.shareUrl) {
      ctx.font = '33px ' + PX;
      var ul = wrapLines(ctx, String(META.shareUrl), W - 2 * M);
      ctx.fillStyle = C.s;
      ctx.fillText(ul[0] + (ul.length > 1 ? '…' : ''), W / 2, H - 90, W - 2 * M);
    }
    return canvas;
  }

  // 備案：全螢幕遮罩顯示分享圖，讓使用者長按(手機)或右鍵(電腦)儲存
  function showShareOverlay(canvas) {
    $('share-img').src = canvas.toDataURL('image/png');
    $('share-overlay').classList.add('active');
  }
  function hideShareOverlay() {
    $('share-overlay').classList.remove('active');
    $('share-img').removeAttribute('src');
  }
  $('btn-share-close').addEventListener('click', hideShareOverlay);

  // 畫字前先確定像素字型已載入
  function fontsReady() {
    try {
      if (document.fonts && document.fonts.load) {
        return Promise.all([document.fonts.load('22px "KBoss Pixel"'), document.fonts.ready]).catch(function () {});
      }
    } catch (e) { /* 舊瀏覽器 */ }
    return Promise.resolve();
  }

  function shareImage() {
    fontsReady().then(function () {
      var canvas = makeShareCanvas();
      var filename = ((META.title || 'share') + '-' + (endingInfo().state.ending || '')).replace(/[\\/:*?"<>|\s]/g, '_') + '.png';
      canvas.toBlob(function (blob) {
        if (!blob) { showShareOverlay(canvas); return; }
        var file = null;
        try { file = new File([blob], filename, { type: 'image/png' }); } catch (e) { file = null; }
        var canShareFile = false;
        try {
          canShareFile = !!(file && navigator.share && navigator.canShare && navigator.canShare({ files: [file] }));
        } catch (e) { canShareFile = false; }

        if (!canShareFile) {
          showShareOverlay(canvas);
          return;
        }
        // 使用者自己取消(AbortError)就不做事；其他錯誤改顯示遮罩
        function onShareError(err) {
          if (err && err.name === 'AbortError') return;
          showShareOverlay(canvas);
        }
        try {
          navigator.share({ files: [file], title: META.title || '' }).catch(onShareError);
        } catch (err) {
          onShareError(err);
        }
      }, 'image/png');
    });
  }

  $('btn-share').addEventListener('click', shareImage);

  // ---------- 除錯模式(?debug=1 才建立任何除錯元素) ----------
  var dbg = null;

  function setupDebug() {
    // 開局：身份下拉選單 + 特質勾選
    var startBox = el('div', 'dbg-start');
    startBox.appendChild(el('div', null, '[除錯] 指定身份／特質(不選 = 隨機)'));
    var sel = el('select');
    sel.id = 'dbg-identity';
    var optRandom = el('option', null, '(隨機)');
    optRandom.value = '';
    sel.appendChild(optRandom);
    DATA.identities.forEach(function (i) {
      var o = el('option', null, i.name);
      o.value = i.id;
      sel.appendChild(o);
    });
    sel.addEventListener('change', function () {
      debugPick.identity = sel.value;
      startNewGame();
    });
    startBox.appendChild(sel);

    var traitWrap = el('div');
    DATA.traits.forEach(function (t) {
      var lab = el('label');
      var cb = el('input');
      cb.type = 'checkbox';
      cb.value = t.id;
      cb.className = 'dbg-trait';
      cb.addEventListener('change', function () {
        debugPick.traits = Array.from(traitWrap.querySelectorAll('input:checked')).map(function (x) { return x.value; });
        startNewGame();
      });
      lab.appendChild(cb);
      lab.appendChild(document.createTextNode(t.name));
      traitWrap.appendChild(lab);
    });
    startBox.appendChild(traitWrap);
    $('start-debug-slot').appendChild(startBox);

    // 遊戲中浮動面板
    var panel = el('div', 'dbg-panel');
    panel.id = 'dbg-panel';
    var head = el('div', 'dbg-row');
    var toggle = el('button', null, '收合');
    toggle.type = 'button';
    toggle.addEventListener('click', function (e) {
      e.stopPropagation();
      panel.classList.toggle('collapsed');
      toggle.textContent = panel.classList.contains('collapsed') ? '除錯' : '收合';
    });
    head.appendChild(toggle);
    panel.appendChild(head);

    var body = el('div', 'dbg-body');
    var cardLine = el('div');
    var statsBox = el('div');
    var tagsBox = el('div');
    var jumpRow = el('div', 'dbg-row');
    var input = el('input');
    input.type = 'number';
    input.min = '1';
    input.id = 'dbg-turn';
    var jumpBtn = el('button', null, '跳到');
    jumpBtn.type = 'button';
    jumpBtn.id = 'dbg-jump';
    jumpBtn.addEventListener('click', function () {
      var n = parseInt(input.value, 10);
      if (n >= 1 && phase === 'card') {   // 後果句顯示期間不跳
        E.jumpToTurn(n);
        renderGame();
      }
    });
    jumpRow.appendChild(el('span', null, 'turn'));
    jumpRow.appendChild(input);
    jumpRow.appendChild(jumpBtn);
    body.appendChild(cardLine);
    body.appendChild(statsBox);
    body.appendChild(tagsBox);
    body.appendChild(jumpRow);
    panel.appendChild(body);
    document.body.appendChild(panel);

    dbg = { panel: panel, cardLine: cardLine, statsBox: statsBox, tagsBox: tagsBox };
  }

  function updateDebugPanel() {
    if (!dbg) return;
    var st = E.getState();
    dbg.cardLine.textContent = 'card: ' + (st.cardId || '-') + '  turn: ' + st.turn + '  phase: ' + st.phase + '  eval: ' + (st.evalGrade || '-');
    dbg.statsBox.innerHTML = '';
    DATA.stats.forEach(function (s) {
      dbg.statsBox.appendChild(el('div', null, s.id + ' = ' + st.stats[s.id]));
    });
    dbg.tagsBox.innerHTML = '';
    (DATA.tags || []).forEach(function (t) {
      dbg.tagsBox.appendChild(el('div', null, '#' + t.id + ' = ' + st.tags[t.id]));
    });
  }

  // ---------- 啟動 ----------
  buildStatsRow($('stats-row'), statNodes);
  buildStatsRow($('end-stats'), endStatNodes);
  if (DEBUG) setupDebug();
  startNewGame();

  // 除錯：?debug=1&ending={結局id} 直接顯示該結局畫面(沒有 debug=1 時完全無效)
  if (DEBUG && PARAMS.get('ending')) {
    var preview = debugEndingPreview(PARAMS.get('ending'));
    if (preview) {
      endOverride = preview;
      stopRolling();
      renderEnd();
      show('end');
      startCountdown();
    }
  }
})();
</script>
